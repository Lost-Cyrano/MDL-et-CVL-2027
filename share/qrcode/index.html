<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>QR Code de la page Inscription — Honoré Romane</title>
    <style>
        :root {
            --bg: #f5f3ef;
            --card: #ffffff;
            --border: #e5e2dc;
            --text: #1a1a1a;
            --text-muted: #6b6b6b;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e0e0e;
                --card: #1a1a1a;
                --border: #2e2e2e;
                --text: #f2f2f2;
                --text-muted: #9a9a9a;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(1rem, 4vw, 3rem);
        }

        .container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            padding: clamp(1.5rem, 5vw, 3rem);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(1.25rem, 3vw, 2rem);
            max-width: 32rem;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: clamp(1.15rem, 2.5vw + 0.5rem, 1.6rem);
            font-weight: 600;
            line-height: 1.3;
        }

        .qr-wrapper {
            width: 100%;
            max-width: 24rem;
            aspect-ratio: 1 / 1;
            padding: clamp(0.75rem, 2vw, 1.25rem);
            background: #ffffff;
            border-radius: 1rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .caption {
            font-size: clamp(0.85rem, 1vw + 0.6rem, 1rem);
            color: var(--text-muted);
            line-height: 1.5;
            word-break: break-all;
        }

        .caption a {
            color: var(--text);
            text-decoration: underline;
            text-underline-offset: 0.15em;
            font-weight: 500;
        }

        .caption a:hover {
            opacity: 0.75;
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>Scannez ce QR Code pour vous inscrire</h1>

        <div class="qr-wrapper">
            <img
                src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=0&data=https%3A%2F%2Faccount.honore-romane.fr%2Fsignup%2F"
                alt="QR Code vers la page d'inscription"
                width="600"
                height="600"
            >
        </div>

        <p class="caption">
            Ou rendez-vous directement sur :<br>
            <a href="https://account.honore-romane.fr/signup/">https://account.honore-romane.fr/signup/</a>
        </p>
    </main>

</body>
</html>
