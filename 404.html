<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Page introuvable — Honoré Romane</title>
    <style>
        :root {
            --bg: #f5f3ef;
            --card: #ffffff;
            --text: #1a1a1a;
            --text-muted: #6b6b6b;
            --accent: #1a1a1a;
            --accent-hover: #000000;
            --accent-text: #ffffff;
            --radius: 0.75rem;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e0e0e;
                --card: #1a1a1a;
                --text: #f2f2f2;
                --text-muted: #9a9a9a;
                --accent: #f2f2f2;
                --accent-hover: #ffffff;
                --accent-text: #0e0e0e;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: clamp(14px, 1vw + 12px, 17px);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
                     max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
            gap: 1rem;
        }

        .container {
            width: 100%;
            max-width: 32rem;
            background: var(--card);
            border-radius: var(--radius);
            padding: clamp(1.5rem, 4vw, 2.25rem);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            margin: auto 0;
        }

        @media (prefers-color-scheme: dark) {
            .container {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            }
        }

        .code {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 700;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95em;
            margin-bottom: 1.75rem;
        }

        a.button {
            display: block;
            text-decoration: none;
            background: var(--accent);
            color: var(--accent-text);
            font-weight: 600;
            padding: 0.85rem;
            border-radius: 0.5rem;
            transition: background .15s;
        }

        a.button:hover {
            background: var(--accent-hover);
        }

        .footer {
            width: 100%;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.72em;
            padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
            opacity: 0.7;
            user-select: none;
        }
    </style>
</head>
<body>
    <main class="container" role="main">
        <div class="code">404</div>
        <p>Cette page n'existe pas, n'est pas encore disponible ou a été déplacée.</p>
        <a href="https://account.honore-romane.fr/account/" class="button">Retour à la page d'acceuil</a>
    </main>

    <footer class="footer">
        MAIRE Anael pour Honoré Romane 2027 — Tous droits réservés
    </footer>
</body>
</html>
