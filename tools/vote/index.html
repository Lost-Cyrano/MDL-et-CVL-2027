<!DOCTYPE html> 
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Redirection — Honoré Romane</title>
    <style>
        :root {
            --bg: #f5f3ef;
            --card: #ffffff;
            --text: #1a1a1a;
            --text-muted: #6b6b6b;
            --accent: #1a1a1a;
            --accent-text: #ffffff;
            --radius: 0.75rem;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e0e0e;
                --card: #1a1a1a;
                --text: #f2f2f2;
                --text-muted: #9a9a9a;
                --accent: #f2f2f2;
                --accent-text: #0e0e0e;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: clamp(14px, 1vw + 12px, 17px);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
                     max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
            gap: 1rem;
        }

        .container {
            width: 100%;
            max-width: 32rem;
            background: var(--card);
            border-radius: var(--radius);
            padding: clamp(1.5rem, 4vw, 2.25rem);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            margin: auto 0;
        }

        @media (prefers-color-scheme: dark) {
            .container {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            }
        }

        .spinner {
            width: 2.25rem;
            height: 2.25rem;
            margin: 0 auto 1rem;
            border: 3px solid var(--border, #d8d5cf);
            border-top-color: var(--text);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @media (prefers-color-scheme: dark) {
            .spinner {
                border-color: #3a3a3a;
                border-top-color: var(--text);
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        p {
            color: var(--text-muted);
            font-size: 0.95em;
        }

        .footer {
            width: 100%;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.72em;
            padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
            opacity: 0.7;
            user-select: none;
        }
    </style>
</head>
<body>
    <main class="container" role="main">
        <div class="spinner"></div>
        <p>Redirection en cours…</p>
    </main>

    <footer class="footer">
        MAIRE Anael pour Honoré Romane 2027 — Tous droits réservés
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/jose@5.9.6/dist/browser/jose.umd.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
        import {
            getDatabase,
            ref,
            get
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBulM5-30n3SoH7zT7nxDBvB42Pu4c3qSs",
            authDomain: "mdl-et-cvl-2027.firebaseapp.com",
            projectId: "mdl-et-cvl-2027",
            storageBucket: "mdl-et-cvl-2027.firebasestorage.app",
            messagingSenderId: "142816093888",
            appId: "1:142816093888:web:9f7c3632732a526b7c2f25",
            measurementId: "G-FBKEPBY0CQ",
            databaseURL: "https://mdl-et-cvl-2027-default-rtdb.europe-west1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        const VOTE_URL = 'https://vote.honore-romane.fr';
        const LOGIN_URL = 'https://account.honore-romane.fr/login/';
        const currentUrl = 'https://account.honore-romane.fr/vote/';

        const goToLogin = () => {
            window.location.replace(
                LOGIN_URL + '?redirect=' + encodeURIComponent(currentUrl)
            );
        };

        // Signature JWT HS256 avec la clé lue dans RTDB
        async function buildSignedToken(uid, siege) {
            const keySnap = await get(ref(rtdb, 'config/jwtKey'));
            if (!keySnap.exists()) throw new Error('Clé JWT absente de RTDB');
            const secret = new TextEncoder().encode(keySnap.val());

            const now = Math.floor(Date.now() / 1000);
            const payload = {
                iss: 'account.honore-romane.fr',
                aud: 'vote.honore-romane.fr',
                sub: uid,
                siege: siege,
                iat: now,
                exp: now + 120 // 2 minutes
            };

            return await jose.SignJWT(payload)
                .setProtectedHeader({ alg: 'HS256', typ: 'JWT' })
                .sign(secret);
        }

        // On attend que Firebase ait restauré la session (ou non)
        const unsubscribe = onAuthStateChanged(auth, async (user) => {
            unsubscribe();

            if (!user) {
                goToLogin();
                return;
            }

            try {
                // Vérifier que le compte est actif
                const snap = await getDoc(doc(db, 'users', user.uid));
                if (!snap.exists() || snap.data().status !== 'active') {
                    await signOut(auth);
                    goToLogin();
                    return;
                }

                const userData = snap.data();
                // Numéro de siège — adaptez le nom du champ si besoin
                const siege = userData.siege;
                if (!siege) throw new Error('Numéro de siège introuvable pour cet utilisateur');

                // Génération du JWT signé
                const token = await buildSignedToken(user.uid, siege);

                // Redirection vers le site de vote avec le token
                window.location.replace(VOTE_URL + '/?t=' + encodeURIComponent(token));

            } catch (err) {
                console.error(err);
                await signOut(auth).catch(() => {});
                goToLogin();
            }
        });
    </script>
</body>
</html>
