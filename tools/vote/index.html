<!DOCTYPE html> 
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Redirection — Honoré Romane</title>
    <style>
        :root {
            --bg: #f5f3ef;
            --card: #ffffff;
            --text: #1a1a1a;
            --text-muted: #6b6b6b;
            --accent: #1a1a1a;
            --accent-text: #ffffff;
            --radius: 0.75rem;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e0e0e;
                --card: #1a1a1a;
                --text: #f2f2f2;
                --text-muted: #9a9a9a;
                --accent: #f2f2f2;
                --accent-text: #0e0e0e;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: clamp(14px, 1vw + 12px, 17px);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
                     max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
            gap: 1rem;
        }

        .container {
            width: 100%;
            max-width: 32rem;
            background: var(--card);
            border-radius: var(--radius);
            padding: clamp(1.5rem, 4vw, 2.25rem);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            margin: auto 0;
        }

        @media (prefers-color-scheme: dark) {
            .container {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            }
        }

        .spinner {
            width: 2.25rem;
            height: 2.25rem;
            margin: 0 auto 1rem;
            border: 3px solid #d8d5cf;
            border-top-color: var(--text);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @media (prefers-color-scheme: dark) {
            .spinner {
                border-color: #3a3a3a;
                border-top-color: var(--text);
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        p {
            color: var(--text-muted);
            font-size: 0.95em;
        }

        .error {
            color: #b91c1c;
            font-size: 0.85em;
            margin-top: 0.75rem;
            word-break: break-word;
        }

        .btn {
            display: none;
            margin-top: 1rem;
            padding: 0.6rem 1.2rem;
            background: var(--accent);
            color: var(--accent-text);
            border-radius: 0.5rem;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .footer {
            width: 100%;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.72em;
            padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
            opacity: 0.7;
            user-select: none;
        }
    </style>
</head>
<body>
    <main class="container" role="main">
        <div class="spinner" id="spinner"></div>
        <p id="status-msg">Redirection en cours…</p>
        <p class="error" id="error-msg"></p>
        <button class="btn" id="retry-btn" type="button">Réessayer</button>
    </main>

    <footer class="footer">
        MAIRE Anael pour Honoré Romane 2027 — Tous droits réservés
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBulM5-30n3SoH7zT7nxDBvB42Pu4c3qSs",
            authDomain: "mdl-et-cvl-2027.firebaseapp.com",
            projectId: "mdl-et-cvl-2027",
            storageBucket: "mdl-et-cvl-2027.firebasestorage.app",
            messagingSenderId: "142816093888",
            appId: "1:142816093888:web:9f7c3632732a526b7c2f25",
            measurementId: "G-FBKEPBY0CQ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const VOTE_URL = 'https://vote.honore-romane.fr';
        const LOGIN_URL = 'https://account.honore-romane.fr/login/';
        const currentUrl = 'https://account.honore-romane.fr/tools/vote/';

        const showError = (msg) => {
            const el = document.getElementById('error-msg');
            if (el) el.textContent = msg;
            const sp = document.getElementById('spinner');
            if (sp) sp.style.display = 'none';
            const st = document.getElementById('status-msg');
            if (st) st.textContent = 'Impossible de continuer.';
            const btn = document.getElementById('retry-btn');
            if (btn) btn.style.display = 'inline-block';
            console.error(msg);
        };

        const goToLogin = () => {
            window.location.replace(
                LOGIN_URL + '?redirect=' + encodeURIComponent(currentUrl)
            );
        };

        // --- Helpers base64url ---
        function b64urlEncode(bytes) {
            let bin = '';
            for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function b64urlEncodeString(str) {
            return b64urlEncode(new TextEncoder().encode(str));
        }

        // --- Signature JWT HS256 avec crypto.subtle (aucune dépendance) ---
        async function buildSignedToken(uid, siege) {
            const keySnap = await getDoc(doc(db, 'config', 'jwtKey'));
            if (!keySnap.exists()) throw new Error('Clé JWT absente de Firestore (config/jwtKey)');
            const raw = keySnap.data().value;
            if (!raw || typeof raw !== 'string') throw new Error('Champ config/jwtKey.value invalide');

            const now = Math.floor(Date.now() / 1000);
            const header = { alg: 'HS256', typ: 'JWT' };
            const payload = {
                iss: 'account.honore-romane.fr',
                aud: 'vote.honore-romane.fr',
                sub: uid,
                siege: siege,
                iat: now,
                exp: now + 120
            };

            const headerB64 = b64urlEncodeString(JSON.stringify(header));
            const payloadB64 = b64urlEncodeString(JSON.stringify(payload));
            const data = headerB64 + '.' + payloadB64;

            const cryptoKey = await crypto.subtle.importKey(
                'raw',
                new TextEncoder().encode(raw),
                { name: 'HMAC', hash: 'SHA-256' },
                false,
                ['sign']
            );
            const sigBuf = await crypto.subtle.sign('HMAC', cryptoKey, new TextEncoder().encode(data));
            const sigB64 = b64urlEncode(new Uint8Array(sigBuf));

            return data + '.' + sigB64;
        }

        const unsubscribe = onAuthStateChanged(auth, async (user) => {
            unsubscribe();

            if (!user) {
                goToLogin();
                return;
            }

            try {
                const snap = await getDoc(doc(db, 'users', user.uid));
                if (!snap.exists()) {
                    showError('Profil utilisateur introuvable dans Firestore.');
                    return;
                }

                const userData = snap.data();

                if (userData.status !== 'active') {
                    showError('Compte non actif (status: ' + userData.status + '). Contactez un administrateur.');
                    return;
                }

                const siege = userData.seatNumber;
                if (siege === undefined || siege === null || siege === '') {
                    showError('Numéro de siège (seatNumber) manquant sur le profil.');
                    return;
                }

                const token = await buildSignedToken(user.uid, siege);
                window.location.replace(VOTE_URL + '/?t=' + encodeURIComponent(token));

            } catch (err) {
                showError('Erreur : ' + (err.message || err));
            }
        });

        document.getElementById('retry-btn').addEventListener('click', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
