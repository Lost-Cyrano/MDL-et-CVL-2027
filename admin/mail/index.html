<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Envoi de mails — Honoré Romane</title>
    <style>
        :root {
            --bg: #f5f3ef;
            --card: #ffffff;
            --card-hover: #fafaf8;
            --field: #fafaf8;
            --border: #e5e2dc;
            --text: #1a1a1a;
            --text-muted: #6b6b6b;
            --accent: #1a1a1a;
            --accent-hover: #000000;
            --accent-text: #ffffff;
            --success: #1e7d4a;
            --warning: #b45309;
            --error: #c0392b;
            --radius: 0.75rem;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e0e0e;
                --card: #1a1a1a;
                --card-hover: #232323;
                --field: #232323;
                --border: #2e2e2e;
                --text: #f2f2f2;
                --text-muted: #9a9a9a;
                --accent: #f2f2f2;
                --accent-hover: #ffffff;
                --accent-text: #0e0e0e;
                --success: #4ade80;
                --warning: #fbbf24;
                --error: #ff6b5e;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: clamp(13px, 1vw + 11px, 15px);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: max(1rem, env(safe-area-inset-top)) clamp(1rem, 4vw, 2.5rem) 1rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 20;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 0;
            flex: 1;
        }

        .back-link {
            font-family: inherit;
            font-size: 0.85em;
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.4rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            transition: color .15s, border-color .15s;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .back-link:hover {
            color: var(--text);
            border-color: var(--text);
        }

        .page-title {
            font-weight: 600;
            font-size: 0.95em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .quota-info {
            font-size: 0.78em;
            color: var(--text-muted);
            padding: 0.35rem 0.7rem;
            background: var(--field);
            border: 1px solid var(--border);
            border-radius: 2rem;
            white-space: nowrap;
        }

        .quota-info.low {
            color: var(--error);
            border-color: color-mix(in srgb, var(--error) 40%, transparent);
        }

        .logout-btn {
            font-family: inherit;
            font-size: 0.82em;
            font-weight: 500;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            padding: 0.5rem 0.9rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: color .15s, border-color .15s;
            flex-shrink: 0;
        }

        .logout-btn:hover:not(:disabled) {
            color: var(--text);
            border-color: var(--text);
        }

        .logout-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 100rem;
            margin: 0 auto;
            padding: clamp(1rem, 3vw, 2rem) clamp(1rem, 4vw, 2.5rem);
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
            gap: 1.25rem;
            align-items: start;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: clamp(1rem, 2.5vw, 1.5rem);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .panel-title {
            font-size: 0.78em;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .search {
            font-family: inherit;
            font-size: 0.9em;
            padding: 0.6rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background: var(--field);
            color: var(--text);
            outline: none;
            transition: border-color .15s;
            width: 100%;
        }

        .search:focus {
            border-color: var(--accent);
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .chip {
            font-family: inherit;
            font-size: 0.78em;
            font-weight: 500;
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            border-radius: 2rem;
            cursor: pointer;
            transition: color .15s, border-color .15s, background .15s;
        }

        .chip:hover {
            color: var(--text);
            border-color: var(--text-muted);
        }

        .chip.active {
            background: var(--accent);
            color: var(--accent-text);
            border-color: var(--accent);
        }

        .list {
            max-height: 55vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            padding: 0.5rem 0.25rem 0.5rem 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .list-item {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.5rem 0.4rem;
            border-radius: 0.4rem;
            cursor: pointer;
            transition: background .15s;
            font-size: 0.9em;
        }

        .list-item:hover {
            background: var(--card-hover);
        }

        .list-item input[type="checkbox"] {
            flex-shrink: 0;
            width: 1.05em;
            height: 1.05em;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .list-item .name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }

        .list-item .meta {
            font-size: 0.78em;
            color: var(--text-muted);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .list-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            font-size: 0.8em;
        }

        .list-actions button {
            font-family: inherit;
            font-size: 1em;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.3rem 0.7rem;
            border-radius: 0.4rem;
            cursor: pointer;
            transition: color .15s, border-color .15s;
        }

        .list-actions button:hover {
            color: var(--text);
            border-color: var(--text);
        }

        .counter {
            font-size: 0.82em;
            color: var(--text-muted);
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-field > label {
            font-size: 0.82em;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-field input[type="text"] {
            font-family: inherit;
            font-size: 1em;
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background: var(--field);
            color: var(--text);
            outline: none;
            transition: border-color .15s;
            width: 100%;
        }

        .form-field input[type="text"]:focus {
            border-color: var(--accent);
        }

        /* --- Barre d'outils éditeur --- */
        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            padding: 0.4rem;
            background: var(--field);
            border: 1px solid var(--border);
            border-bottom: none;
            border-radius: 0.5rem 0.5rem 0 0;
            align-items: center;
        }

        .editor-toolbar button,
        .editor-toolbar select {
            font-family: inherit;
            font-size: 0.82em;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text);
            padding: 0.35rem 0.55rem;
            border-radius: 0.35rem;
            cursor: pointer;
            transition: background .15s, border-color .15s;
            min-width: 2rem;
            text-align: center;
        }

        .editor-toolbar button:hover,
        .editor-toolbar select:hover {
            background: var(--card-hover);
            border-color: var(--border);
        }

        .editor-toolbar button.active {
            background: var(--accent);
            color: var(--accent-text);
            border-color: var(--accent);
        }

        .editor-toolbar select {
            min-width: 6rem;
            padding-right: 1.5rem;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b6b6b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.4rem center;
            background-size: 0.8em;
        }

        .editor-toolbar .sep {
            width: 1px;
            height: 1.4em;
            background: var(--border);
            margin: 0.2rem 0.15rem;
        }

        .editor {
            font-family: inherit;
            font-size: 1em;
            padding: 0.85rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 0 0 0.5rem 0.5rem;
            background: var(--field);
            color: var(--text);
            outline: none;
            min-height: 16rem;
            max-height: 45vh;
            overflow-y: auto;
            line-height: 1.6;
            transition: border-color .15s;
        }

        .editor:focus {
            border-color: var(--accent);
        }

        .editor:empty::before {
            content: attr(data-placeholder);
            color: var(--text-muted);
            pointer-events: none;
        }

        .editor a { color: #2563eb; text-decoration: underline; }
        .editor ul, .editor ol { padding-left: 1.5rem; margin: 0.5rem 0; }
        .editor blockquote {
            border-left: 3px solid var(--border);
            padding-left: 0.75rem;
            margin: 0.5rem 0;
            color: var(--text-muted);
            font-style: italic;
        }
        .editor pre {
            background: color-mix(in srgb, var(--text) 8%, transparent);
            padding: 0.6rem;
            border-radius: 0.35rem;
            font-family: monospace;
            font-size: 0.9em;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
        .editor hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1rem 0;
        }
        .editor img {
            max-width: 100%;
            height: auto;
            border-radius: 0.35rem;
            margin: 0.5rem 0;
        }

        .vars-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            align-items: center;
            font-size: 0.78em;
            color: var(--text-muted);
        }

        .var-btn {
            font-family: monospace;
            font-size: 0.95em;
            padding: 0.25rem 0.6rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            border-radius: 0.35rem;
            cursor: pointer;
            transition: color .15s, border-color .15s;
        }

        .var-btn:hover {
            color: var(--text);
            border-color: var(--text);
        }

        .recipients-box {
            background: var(--field);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.5rem 0.6rem;
            min-height: 2.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            align-items: center;
            font-size: 0.85em;
            max-height: 8rem;
            overflow-y: auto;
        }

        .recipient-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.15rem 0.5rem;
            background: color-mix(in srgb, var(--accent) 12%, transparent);
            border: 1px solid var(--border);
            border-radius: 2rem;
            font-size: 0.85em;
            max-width: 100%;
        }

        .recipient-chip span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 14rem;
        }

        .recipient-chip button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1em;
            line-height: 1;
            padding: 0;
            flex-shrink: 0;
        }

        .recipient-chip button:hover {
            color: var(--error);
        }

        .recipients-empty {
            color: var(--text-muted);
            font-size: 0.85em;
            padding: 0.3rem 0;
        }

        .actions-row {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: flex-end;
            margin-top: 0.5rem;
        }

        .btn {
            font-family: inherit;
            font-size: 0.9em;
            font-weight: 600;
            padding: 0.7rem 1.3rem;
            border-radius: 0.5rem;
            border: 1px solid transparent;
            cursor: pointer;
            transition: opacity .15s, border-color .15s, color .15s, background .15s;
        }

        .btn.primary {
            background: var(--accent);
            color: var(--accent-text);
        }

        .btn.primary:hover:not(:disabled) { opacity: 0.85; }

        .btn.secondary {
            background: transparent;
            color: var(--text-muted);
            border-color: var(--border);
        }

        .btn.secondary:hover:not(:disabled) {
            color: var(--text);
            border-color: var(--text);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .feedback {
            font-size: 0.85em;
            padding: 0.7rem 0.9rem;
            border-radius: 0.5rem;
            display: none;
        }

        .feedback.visible { display: block; }

        .feedback.success {
            background: color-mix(in srgb, var(--success) 12%, transparent);
            color: var(--success);
            border: 1px solid color-mix(in srgb, var(--success) 35%, transparent);
        }

        .feedback.error {
            background: color-mix(in srgb, var(--error) 12%, transparent);
            color: var(--error);
            border: 1px solid color-mix(in srgb, var(--error) 35%, transparent);
        }

        .feedback.info {
            background: color-mix(in srgb, var(--accent) 8%, transparent);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .progress {
            margin-top: 0.5rem;
            height: 6px;
            background: var(--field);
            border-radius: 3px;
            overflow: hidden;
            display: none;
        }

        .progress.visible { display: block; }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width .2s;
        }

        .empty {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem 1rem;
            font-size: 0.9em;
        }

        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.72em;
            padding: 1.25rem 1rem max(1.25rem, env(safe-area-inset-bottom));
            opacity: 0.7;
            user-select: none;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
            .list {
                max-height: 40vh;
            }
        }

        @media (max-width: 640px) {
            .page-title { display: none; }
            .quota-info { font-size: 0.72em; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="https://account.honore-romane.fr/account/" class="back-link">← Accueil</a>
            <span class="page-title">Envoi de mails</span>
        </div>
        <div class="header-right">
            <span class="quota-info" id="quota-info">Quota : —</span>
            <button class="logout-btn" id="logout-btn">Déconnexion</button>
        </div>
    </header>

    <main>

        <section class="panel">
            <div class="panel-title">Destinataires</div>

            <input type="search" class="search" id="search" placeholder="Rechercher (nom, mail, classe…)" autocomplete="off">

            <div class="filter-row" id="filters">
                <button class="chip active" data-filter="all">Tous</button>
                <button class="chip" data-filter="cvl">CVL</button>
                <button class="chip" data-filter="mdl">MDL</button>
                <button class="chip" data-filter="eco_delegues">Éco Délégués</button>
                <button class="chip" data-filter="commission">Commission</button>
                <button class="chip" data-filter="utilisateur">Utilisateurs</button>
            </div>

            <div class="list-actions">
                <button id="select-all-visible">Tout sélectionner</button>
                <button id="select-none">Tout désélectionner</button>
            </div>

            <div class="list" id="user-list">
                <div class="empty">Chargement…</div>
            </div>

            <div class="counter" id="counter">0 sélectionné(s)</div>
        </section>

        <section class="panel">
            <div class="panel-title">Message</div>

            <div class="form-field">
                <label>À</label>
                <div class="recipients-box" id="recipients-box">
                    <div class="recipients-empty">Aucun destinataire sélectionné.</div>
                </div>
            </div>

            <div class="form-field">
                <label for="subject">Objet</label>
                <input type="text" id="subject" maxlength="200" required>
            </div>

            <div class="form-field">
                <label>Message</label>

                <div class="editor-toolbar" id="toolbar">
                    <select id="font-family" title="Police">
                        <option value="">Police…</option>
                        <option value="Arial">Arial</option>
                        <option value="Helvetica">Helvetica</option>
                        <option value="Verdana">Verdana</option>
                        <option value="Tahoma">Tahoma</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Courier New">Courier New</option>
                    </select>

                    <select id="font-size" title="Taille">
                        <option value="">Taille…</option>
                        <option value="12px">Très petit (12)</option>
                        <option value="14px">Petit (14)</option>
                        <option value="16px">Normal (16)</option>
                        <option value="18px">Grand (18)</option>
                        <option value="22px">Très grand (22)</option>
                        <option value="28px">Énorme (28)</option>
                        <option value="36px">Géant (36)</option>
                    </select>

                    <div class="sep"></div>

                    <button type="button" data-cmd="bold" title="Gras"><b>G</b></button>
                    <button type="button" data-cmd="italic" title="Italique"><i>I</i></button>
                    <button type="button" data-cmd="underline" title="Souligné"><u>S</u></button>
                    <button type="button" data-cmd="strikeThrough" title="Barré"><s>B</s></button>

                    <div class="sep"></div>

                    <button type="button" data-cmd="insertUnorderedList" title="Liste à puces">•</button>
                    <button type="button" data-cmd="insertOrderedList" title="Liste numérotée">1.</button>

                    <div class="sep"></div>

                    <button type="button" data-cmd="justifyLeft" title="Aligner à gauche">⯇</button>
                    <button type="button" data-cmd="justifyCenter" title="Centrer">≡</button>
                    <button type="button" data-cmd="justifyRight" title="Aligner à droite">⯈</button>

                    <div class="sep"></div>

                    <button type="button" id="btn-link" title="Insérer un lien">🔗</button>
                    <button type="button" id="btn-image" title="Insérer une image">🖼</button>
                    <button type="button" id="btn-hr" title="Ligne de séparation">—</button>
                    <button type="button" id="btn-signature" title="Insérer une signature">✍</button>
                    <button type="button" data-cmd="removeFormat" title="Effacer la mise en forme">✕</button>
                </div>

                <div class="editor" id="editor" contenteditable="true" data-placeholder="Écrivez votre message…"></div>
            </div>

            <div class="vars-bar">
                <span>Variables :</span>
                <button type="button" class="var-btn" data-var="{nom_utilisateur}">{nom_utilisateur}</button>
                <button type="button" class="var-btn" data-var="{prenom}">{prenom}</button>
                <button type="button" class="var-btn" data-var="{email}">{email}</button>
                <button type="button" class="var-btn" data-var="{classe}">{classe}</button>
            </div>

            <div class="actions-row">
                <button class="btn secondary" id="btn-reset">Réinitialiser</button>
                <button class="btn primary" id="btn-send">Envoyer</button>
            </div>

            <div class="progress" id="progress"><div class="progress-bar" id="progress-bar"></div></div>

            <div class="feedback" id="feedback"></div>
        </section>

    </main>

    <footer class="footer">
        MAIRE Anael pour Honoré Romane 2027 — Tous droits réservés
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            collection,
            getDocs,
            query,
            orderBy
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBulM5-30n3SoH7zT7nxDBvB42Pu4c3qSs",
            authDomain: "mdl-et-cvl-2027.firebaseapp.com",
            projectId: "mdl-et-cvl-2027",
            storageBucket: "mdl-et-cvl-2027.firebasestorage.app",
            messagingSenderId: "142816093888",
            appId: "1:142816093888:web:9f7c3632732a526b7c2f25",
            measurementId: "G-FBKEPBY0CQ"
        };

        const BREVO_WORKER_URL = 'https://honore-romane-mail.anaelmaire-pro.workers.dev/';
        const SENDER_EMAIL = 'anaelmaire.pro@gmail.com';
        const SENDER_NAME = 'Honoré Romane';

        // Quota quotidien Brevo (plan gratuit)
        const DAILY_QUOTA = 300;
        const QUOTA_STORAGE_KEY = 'honore_romane_mail_quota';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const LOGIN_URL = 'https://account.honore-romane.fr/login/';
        const HOME_URL = 'https://account.honore-romane.fr/account/';
        const CURRENT_URL = 'https://account.honore-romane.fr/admin/mail/';

        const ROLE_LABELS = {
            cvl: 'CVL',
            mdl: 'MDL',
            eco_delegues: 'Éco Délégués',
            commission: 'Commission',
            utilisateur: 'Utilisateur'
        };

        let me = null;
        let allUsers = [];
        let filteredUsers = [];
        let selectedIds = new Set();
        let currentFilter = 'all';
        let currentSearch = '';

        const userListEl = document.getElementById('user-list');
        const searchEl = document.getElementById('search');
        const counterEl = document.getElementById('counter');
        const filterBtns = document.querySelectorAll('#filters .chip');
        const recipientsBox = document.getElementById('recipients-box');
        const subjectEl = document.getElementById('subject');
        const editorEl = document.getElementById('editor');
        const toolbarEl = document.getElementById('toolbar');
        const btnSend = document.getElementById('btn-send');
        const btnReset = document.getElementById('btn-reset');
        const btnSelectAll = document.getElementById('select-all-visible');
        const btnSelectNone = document.getElementById('select-none');
        const feedbackEl = document.getElementById('feedback');
        const progressEl = document.getElementById('progress');
        const progressBarEl = document.getElementById('progress-bar');
        const logoutBtn = document.getElementById('logout-btn');
        const quotaInfoEl = document.getElementById('quota-info');

        const goToLogin = () => {
            window.location.replace(
                LOGIN_URL + '?redirect=' + encodeURIComponent(CURRENT_URL)
            );
        };
        const goHome = () => window.location.replace(HOME_URL);

        // --- Gestion du quota local ---
        function getQuota() {
            const today = new Date().toISOString().slice(0, 10);
            try {
                const stored = JSON.parse(localStorage.getItem(QUOTA_STORAGE_KEY) || '{}');
                if (stored.date === today) return { used: stored.used || 0, date: today };
            } catch (_) {}
            return { used: 0, date: today };
        }

        function saveQuota(quota) {
            localStorage.setItem(QUOTA_STORAGE_KEY, JSON.stringify(quota));
        }

        function getRemaining() {
            const q = getQuota();
            return Math.max(0, DAILY_QUOTA - q.used);
        }

        function updateQuotaDisplay() {
            const remaining = getRemaining();
            quotaInfoEl.textContent = `Quota : ${remaining} / ${DAILY_QUOTA} mails restants`;
            quotaInfoEl.classList.toggle('low', remaining < 50);
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) { goToLogin(); return; }
            try {
                const snap = await getDoc(doc(db, 'users', user.uid));
                if (!snap.exists() || snap.data().status !== 'active') {
                    await signOut(auth);
                    goToLogin();
                    return;
                }
                me = snap.data();
                if (me.isAdmin !== true) { goHome(); return; }

                updateQuotaDisplay();
                await loadUsers();
            } catch (err) {
                console.error(err);
                await signOut(auth).catch(() => {});
                goToLogin();
            }
        });

        async function loadUsers() {
            try {
                const q = query(collection(db, 'users'), orderBy('name', 'asc'));
                const snap = await getDocs(q);
                allUsers = snap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .filter(u => u.email && u.status === 'active');
                applyFilters();
            } catch (err) {
                console.error(err);
                userListEl.innerHTML = '<div class="empty">Erreur de chargement.</div>';
            }
        }

        function applyFilters() {
            let list = allUsers;
            if (currentFilter !== 'all') {
                list = list.filter(u => u.role === currentFilter);
            }
            if (currentSearch) {
                const s = currentSearch.toLowerCase();
                list = list.filter(u =>
                    (u.name || '').toLowerCase().includes(s) ||
                    (u.email || '').toLowerCase().includes(s) ||
                    (u.classe || '').toLowerCase().includes(s)
                );
            }
            filteredUsers = list;
            renderUserList();
        }

        function renderUserList() {
            if (!filteredUsers.length) {
                userListEl.innerHTML = '<div class="empty">Aucun utilisateur.</div>';
                return;
            }
            userListEl.innerHTML = filteredUsers.map(u => `
                <label class="list-item" data-uid="${esc(u.id)}">
                    <input type="checkbox" ${selectedIds.has(u.id) ? 'checked' : ''}>
                    <span class="name">${esc(u.name || u.email)}</span>
                    <span class="meta">${esc(ROLE_LABELS[u.role] || u.role || '')}</span>
                </label>
            `).join('');

            userListEl.querySelectorAll('.list-item').forEach(item => {
                const uid = item.dataset.uid;
                const checkbox = item.querySelector('input[type="checkbox"]');
                checkbox.addEventListener('change', () => {
                    if (checkbox.checked) selectedIds.add(uid);
                    else selectedIds.delete(uid);
                    renderRecipients();
                });
            });
        }

        function renderRecipients() {
            const selected = allUsers.filter(u => selectedIds.has(u.id));
            if (!selected.length) {
                recipientsBox.innerHTML = '<div class="recipients-empty">Aucun destinataire sélectionné.</div>';
            } else {
                recipientsBox.innerHTML = selected.map(u => `
                    <span class="recipient-chip">
                        <span title="${esc(u.email)}">${esc(u.name || u.email)}</span>
                        <button data-remove="${esc(u.id)}" aria-label="Retirer">×</button>
                    </span>
                `).join('');

                recipientsBox.querySelectorAll('[data-remove]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        selectedIds.delete(btn.dataset.remove);
                        renderUserList();
                        renderRecipients();
                    });
                });
            }
            counterEl.textContent = `${selectedIds.size} sélectionné(s)`;
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilters();
            });
        });

        searchEl.addEventListener('input', () => {
            currentSearch = searchEl.value.trim();
            applyFilters();
        });

        btnSelectAll.addEventListener('click', () => {
            filteredUsers.forEach(u => selectedIds.add(u.id));
            renderUserList();
            renderRecipients();
        });

        btnSelectNone.addEventListener('click', () => {
            selectedIds.clear();
            renderUserList();
            renderRecipients();
        });

        // --- Application de style direct (contourne les bugs de execCommand) ---
        function applyStyleToSelection(styleProp, value) {
            editorEl.focus();
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const range = sel.getRangeAt(0);
            if (range.collapsed) return;

            const span = document.createElement('span');
            span.style[styleProp] = value;
            try {
                range.surroundContents(span);
            } catch (_) {
                // Fallback : extraire et réinsérer
                const content = range.extractContents();
                span.appendChild(content);
                range.insertNode(span);
            }
            sel.removeAllRanges();
            const newRange = document.createRange();
            newRange.selectNodeContents(span);
            sel.addRange(newRange);
        }

        // --- Barre d'outils ---
        toolbarEl.querySelectorAll('[data-cmd]').forEach(el => {
            el.addEventListener('click', (e) => {
                e.preventDefault();
                editorEl.focus();
                document.execCommand(el.dataset.cmd, false, null);
            });
        });

        // Police et taille : application directe via style CSS
        document.getElementById('font-family').addEventListener('change', (e) => {
            if (e.target.value) {
                applyStyleToSelection('fontFamily', e.target.value);
                e.target.selectedIndex = 0;
            }
        });

        document.getElementById('font-size').addEventListener('change', (e) => {
            if (e.target.value) {
                applyStyleToSelection('fontSize', e.target.value);
                e.target.selectedIndex = 0;
            }
        });

        // Lien
        document.getElementById('btn-link').addEventListener('click', (e) => {
            e.preventDefault();
            const url = prompt('URL du lien :', 'https://');
            if (url) {
                editorEl.focus();
                document.execCommand('createLink', false, url);
            }
        });

        // Image
        document.getElementById('btn-image').addEventListener('click', (e) => {
            e.preventDefault();
            const url = prompt('URL de l\'image :', 'https://');
            if (url) {
                editorEl.focus();
                document.execCommand('insertImage', false, url);
            }
        });

        // Ligne horizontale
        document.getElementById('btn-hr').addEventListener('click', (e) => {
            e.preventDefault();
            editorEl.focus();
            document.execCommand('insertHorizontalRule', false, null);
        });

        // Signature
        document.getElementById('btn-signature').addEventListener('click', (e) => {
            e.preventDefault();
            editorEl.focus();
            const sig = document.createElement('div');
            sig.style.marginTop = '1.5rem';
            sig.style.paddingTop = '0.75rem';
            sig.style.borderTop = '1px solid #ccc';
            sig.style.fontSize = '0.9em';
            sig.style.color = '#666';
            sig.innerHTML = '<strong>MAIRE Anael</strong><br>Pour Honoré Romane 2027';
            editorEl.appendChild(sig);
            editorEl.appendChild(document.createElement('br'));
        });

        // Variables : insertion à la position du curseur
        document.querySelectorAll('.var-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const variable = btn.dataset.var;
                editorEl.focus();
                const sel = window.getSelection();
                if (!sel.rangeCount) {
                    editorEl.innerHTML += variable;
                    return;
                }
                const range = sel.getRangeAt(0);
                range.deleteContents();
                range.insertNode(document.createTextNode(variable));
                range.collapse(false);
                sel.removeAllRanges();
                sel.addRange(range);
            });
        });

        // --- Substitution des variables ---
        function substituteVars(html, user) {
            const firstName = (user.name || '').trim().split(/\s+/)[0] || '';
            const map = {
                '{nom_utilisateur}': user.name || '',
                '{prenom}': firstName,
                '{email}': user.email || '',
                '{classe}': user.classe || ''
            };
            let out = html;
            for (const [key, value] of Object.entries(map)) {
                out = out.replaceAll(key, escapeHtml(value));
            }
            return out;
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function esc(str) {
            return escapeHtml(str);
        }

        // --- Envoi ---
        btnSend.addEventListener('click', async () => {
            feedbackEl.className = 'feedback';
            feedbackEl.textContent = '';
            progressEl.classList.remove('visible');
            progressBarEl.style.width = '0%';

            const subject = subjectEl.value.trim();
            const rawHtml = editorEl.innerHTML.trim();
            const selected = allUsers.filter(u => selectedIds.has(u.id));
            const remaining = getRemaining();

            if (!selected.length) {
                showFeedback('error', 'Sélectionnez au moins un destinataire.');
                return;
            }
            if (!subject) {
                showFeedback('error', 'L\'objet est requis.');
                return;
            }
            if (!rawHtml || !editorEl.textContent.trim()) {
                showFeedback('error', 'Le message est requis.');
                return;
            }
            if (selected.length > remaining) {
                showFeedback('error', `Quota insuffisant : ${remaining} mail(s) restant(s) aujourd'hui, ${selected.length} demandé(s).`);
                return;
            }

            // DÉSACTIVÉ : plus de confirmation avant envoi
            btnSend.disabled = true;
            const original = btnSend.textContent;
            btnSend.textContent = 'Envoi…';
            progressEl.classList.add('visible');

            let success = 0;
            let failures = [];

            for (let i = 0; i < selected.length; i++) {
                const user = selected[i];
                const html = substituteVars(rawHtml, user);
                const text = editorEl.textContent;

                try {
                    const response = await fetch(BREVO_WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            to: user.email,
                            subject,
                            htmlContent: html,
                            textContent: text,
                            sender: { name: SENDER_NAME, email: SENDER_EMAIL }
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error(err.error || `HTTP ${response.status}`);
                    }

                    success++;
                } catch (err) {
                    console.error('Échec pour', user.email, err);
                    failures.push(`${user.email} (${err.message})`);
                }

                const pct = Math.round(((i + 1) / selected.length) * 100);
                progressBarEl.style.width = pct + '%';
                btnSend.textContent = `Envoi ${i + 1}/${selected.length}…`;
            }

            // Mise à jour du quota local
            const q = getQuota();
            q.used += success;
            saveQuota(q);
            updateQuotaDisplay();

            btnSend.disabled = false;
            btnSend.textContent = original;
            progressEl.classList.remove('visible');

            if (failures.length === 0) {
                showFeedback('success', `✓ ${success} mail(s) envoyé(s) avec succès.`);
            } else {
                showFeedback('error', `${success} réussi(s), ${failures.length} échec(s) : ${failures.slice(0, 3).join(', ')}${failures.length > 3 ? '…' : ''}`);
            }
        });

        btnReset.addEventListener('click', () => {
            selectedIds.clear();
            subjectEl.value = '';
            editorEl.innerHTML = '';
            renderUserList();
            renderRecipients();
            feedbackEl.className = 'feedback';
            feedbackEl.textContent = '';
        });

        function showFeedback(type, msg) {
            feedbackEl.className = 'feedback visible ' + type;
            feedbackEl.textContent = msg;
        }

        logoutBtn.addEventListener('click', async () => {
            logoutBtn.disabled = true;
            logoutBtn.textContent = 'Déconnexion…';
            try { await signOut(auth); } catch (err) { console.error(err); }
            finally { window.location.replace(LOGIN_URL); }
        });
    </script>
</body>
</html>
