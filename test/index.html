<!DOCTYPE html>
<html lang="fr">
<head>

  </nav>
  <span class="user-badge">👤 Vous</span>

<!-- CALENDRIER MENSUEL -->
<main class="calendar-wrap" id="calendarView">
  <div class="calendar-nav">
    <button class="nav-btn" id="calPrev">◀</button>
    <h2 id="calLabel">—</h2>

<!-- VUE JOUR -->
<main class="day-view" id="dayView">
  <div class="day-view-header">
    <button class="back-btn" id="btnBack">◀ Retour</button>
    <h2 id="dayTitle">—</h2>
  </div>
  <div class="locked-banner" id="lockedBanner" style="display:none;">
    🔒 Ce jour est passé, aujourd'hui, ou demain → modifications impossibles.
  </div>

  <div class="legend">
    <span class="lg-item"><span class="lg-swatch lg-free"></span>À combler</span>
    <span class="lg-item"><span class="lg-swatch lg-taken"></span>Pris</span>
    <span class="lg-item"><span class="lg-swatch lg-mine"></span>Vous</span>

  </div>

  <div class="grid-scroll">
    <div class="day-grid" id="dayGrid"></div>
  </div>
</main>

<!-- MON PLANNING -->
<main class="calendar-view" id="myPlanningView">
  <div class="gcal-nav">
    <button class="nav-btn" id="mpPrev">◀</button>
    <h2 id="mpLabel">—</h2>
    <button class="nav-btn" id="mpNext">▶</button>
  </div>
  <div class="gcal-container">
    <div class="gcal-scroll">
      <div class="gcal-grid" id="gcalGrid"></div>
    </div>
  </div>
  <div style="text-align:center;margin-top:12px;">
    <button class="nav-btn today" id="mpToday">Aujourd'hui</button>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-inner">
      <button class="modal-close" id="modalClose">×</button>
      <h3 id="modalTitle">—</h3>
      <div id="modalBody"></div>
      <div class="actions" id="modalActions"></div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   CONSTANTES
   ===================================================================== */
const CURRENT_USER = { id: 'u1', name: 'Vous' };
const USERS = {
  u1: 'Vous', u2: 'Alice', u3: 'Bob', u4: 'Chloé', u5: 'David', u6: 'Emma'
};

let EVENTS = [];
let bookings = {};
let _id = 0;
const nextId = () => `s${++_id}`;

/* Seed démo */
(function seed() {
  const add = (dateStr, missionId, userId, sH, sM, eH, eM) => {
    const key = `${dateStr}|${missionId}`;
    if (!bookings[key]) bookings[key] = [];
    bookings[key].push({ id: nextId(), userId, start: sH*60+sM, end: eH*60+eM });
  };
  const t = new Date();
  const dOff = n => { const d = new Date(t); d.setDate(d.getDate()+n); return fmtDate(d); };

  add(dOff(2), 'pain-vendeur', 'u2', 10, 0, 11, 0);
  add(dOff(2), 'pain-vendeur', 'u3', 9, 0, 10, 0);
  add(dOff(2), 'pain-vendeur', 'u4', 11, 30, 12, 0);
  add(dOff(3), 'pain-vendeur', 'u5', 9, 0, 10, 30);
  add(dOff(3), 'pain-vendeur', 'u6', 10, 30, 12, 0);
  add(dOff(3), 'pain-vendeur', 'u1', 14, 0, 15, 0);

  add('2026-11-23', 'loto-buvette', 'u2', 8, 0, 12, 0);
  add('2026-11-23', 'loto-caissier', 'u3', 8, 0, 17, 0);
  add('2026-11-23', 'loto-present', 'u4', 14, 0, 17, 0);
})();

/* =====================================================================
   UTILITAIRES
   ===================================================================== */
function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseDate(s) { return new Date(s + 'T00:00:00'); }
function todayStr() { return fmtDate(new Date()); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function jsDayToOur(d) { const j = d.getDay(); return j === 0 ? 7 : j; }
function isLocked(dateStr) {
  const t = new Date(); t.setHours(0,0,0,0);
  return (parseDate(dateStr) - t) / 86400000 <= 1;
}
function fmtHM(min) {
  const h = Math.floor(min/60);
  const m = min % 60;
  return `${String(h).padStart(2,'0')}h${m ? String(m).padStart(2,'0') : ''}`;
}
function fmtHMfull(min) {
  return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`;
}
function minToTimeStr(m) { return fmtHMfull(m); }
function timeStrToMin(s) { const [h,m] = s.split(':').map(Number); return h*60+m; }

/* =====================================================================
   LOGIQUE
   ===================================================================== */
function eventsForDate(dateStr) {
  const d = parseDate(dateStr);
  const dayNum = jsDayToOur(d);
  return EVENTS.filter(ev => {
    if (ev.type === 'punctual') return ev.specificDate === dateStr;
    if (ev.type === 'recurring') return ev.recurrence && ev.recurrence.days.includes(dayNum);
    return false;
  });
}

function missionRangesForDate(mission, dateStr) {
  const d = parseDate(dateStr);
  const dayNum = jsDayToOur(d);
  const out = [];
  (mission.ranges || []).forEach(r => {
    if (r.excludeOn && r.excludeOn.includes(dayNum)) return;
    out.push({ start: r.start*60, end: r.end*60 });
  });
  out.sort((a,b)=>a.start-b.start);
  const merged = [];
  out.forEach(r => {
    if (merged.length && r.start <= merged[merged.length-1].end) {
      merged[merged.length-1].end = Math.max(merged[merged.length-1].end, r.end);
    } else merged.push({ ...r });
  });
  return merged;
}

function getShifts(dateStr, missionId) {
  return bookings[`${dateStr}|${missionId}`] || [];
}

function coverAt(dateStr, missionId, minute) {
  let total = 0;
  getShifts(dateStr, missionId).forEach(s => {
    if (minute >= s.start && minute < s.end) total++;
  });
  return total;
}

function userHasOverlap(dateStr, missionId, userId, start, end) {
  return getShifts(dateStr, missionId).some(s =>
    s.userId === userId && !(end <= s.start || start >= s.end)
  );
}

/* Vérifie si l'utilisateur a un shift sur N'IMPORTE QUELLE mission
   du jour qui chevauche [start,end) — pour interdire double inscription
   sur la même plage horaire, tous événements confondus. */
function userHasOverlapAnyMission(dateStr, userId, start, end, excludeShiftId) {
  const evs = eventsForDate(dateStr);
  for (const ev of evs) {
    for (const mission of ev.missions) {
      const shifts = getShifts(dateStr, mission.id);
      for (const s of shifts) {
        if (s.userId !== userId) continue;
        if (excludeShiftId && s.id === excludeShiftId) continue;
        if (!(end <= s.start || start >= s.end)) {
          return { ev, mission, shift: s };
        }
      }
    }
  }
  return null;
}

function shiftWithinRanges(start, end, ranges) {
  return ranges.some(r => start >= r.start && end <= r.end);
}

/* Calcule le statut d'une mission sur la journée (complète/partielle/vide) */
function missionDayStatus(dateStr, mission) {
  const ranges = missionRangesForDate(mission, dateStr);
  if (ranges.length === 0) return 'empty';
  let totalMin = 0, coveredMin = 0;
  ranges.forEach(r => {
    for (let m = r.start; m < r.end; m++) {
      totalMin++;
      if (coverAt(dateStr, mission.id, m) >= mission.quota) coveredMin++;
    }
  });
  if (coveredMin === 0) return 'empty';
  if (coveredMin === totalMin) return 'full';
  return 'partial';
}

function eventDayStatus(dateStr, ev) {
  const statuses = ev.missions
    .map(m => missionDayStatus(dateStr, m))
    .filter(s => s !== 'empty');
  if (statuses.length === 0) return 'empty';
  if (statuses.every(s => s === 'full')) return 'full';
  return 'partial';
}

const STATUS_COLOR = { full: '#27ae60', partial: '#f39c12', empty: '#c0392b' };

/* =====================================================================
   ÉTAT
   ===================================================================== */
let calMonth = new Date();
let currentDay = null;
let myPlanningDate = new Date();

/* =====================================================================
   CHARGEMENT
   ===================================================================== */
async function loadEvents() {
  try {
    const res = await fetch('./events.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    EVENTS = data.events || [];
  } catch (err) {
    console.error('Impossible de charger events.json', err);
    alert("Impossible de charger ./events.json — servez la page via un serveur HTTP (ex: python -m http.server).");
  }
  renderCalendar();
}

/* =====================================================================
   CALENDRIER MENSUEL — affiche directement les noms d'événements
   ===================================================================== */
function renderCalendar() {
  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';
  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();
  const firstDay = new Date(year, month, 1);

  document.getElementById('calLabel').textContent =
    firstDay.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

  ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  let startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
  const startDate = new Date(year, month, 1 - startOffset);
  const tStr = todayStr();

  for (let i = 0; i < 42; i++) {
    const d = addDays(startDate, i);
    const dateStr = fmtDate(d);
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    if (d.getMonth() !== month) cell.classList.add('other-month');
    if (dateStr === tStr) cell.classList.add('today');
    if (isLocked(dateStr)) cell.classList.add('locked');

    const evs = eventsForDate(dateStr);
    let chipsHTML = '';
    evs.slice(0, 3).forEach(ev => {
      const status = eventDayStatus(dateStr, ev);
      chipsHTML += `<span class="ev-chip" style="background:${ev.color || '#3498db'}">${ev.name}</span>`;
    });
    if (evs.length > 3) {
      chipsHTML += `<span class="ev-chip" style="background:#7f8c8d">+${evs.length-3}</span>`;
    }

    cell.innerHTML = `
      <span class="day-num">${d.getDate()}</span>
      <div class="ev-chips">${chipsHTML}</div>
    `;
    cell.addEventListener('click', () => openDayView(dateStr));
    grid.appendChild(cell);
  }
}

/* =====================================================================
   VUE JOUR
   ===================================================================== */
function openDayView(dateStr) {
  currentDay = dateStr;
  document.getElementById('calendarView').style.display = 'none';
  document.getElementById('myPlanningView').classList.remove('active');
  document.getElementById('dayView').classList.add('active');
  document.getElementById('tabMyPlanning').classList.remove('active');
  document.getElementById('tabPlanning').classList.add('active');

  const d = parseDate(dateStr);
  document.getElementById('dayTitle').textContent = d.toLocaleDateString('fr-FR', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });
  document.getElementById('lockedBanner').style.display = isLocked(dateStr) ? 'block' : 'none';
  renderDayGrid();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeDayView() {
  document.getElementById('dayView').classList.remove('active');
  document.getElementById('calendarView').style.display = 'block';
  currentDay = null;
  renderCalendar();
}

/* =====================================================================
   RENDU GRILLE JOUR
   ===================================================================== */
function renderDayGrid() {
  const grid = document.getElementById('dayGrid');
  grid.innerHTML = '';
  const dateStr = currentDay;
  const evs = eventsForDate(dateStr);
  const locked = isLocked(dateStr);

  const cols = [];
  evs.forEach(ev => {
    ev.missions.forEach(m => {
      const ranges = missionRangesForDate(m, dateStr);
      if (ranges.length === 0) return;
      cols.push({ ev, mission: m, ranges });
    });
  });

  if (cols.length === 0) {
    grid.style.display = 'block';
    grid.innerHTML = `<div class="empty-state" style="padding:40px;">Aucun événement prévu ce jour.</div>`;
    return;
  }
  grid.style.display = 'grid';

  let minMin = Infinity, maxMin = -Infinity;
  cols.forEach(c => c.ranges.forEach(r => {
    minMin = Math.min(minMin, r.start);
    maxMin = Math.max(maxMin, r.end);
  }));
  const startH = Math.max(0, Math.floor(minMin/60));
  const endH = Math.min(24, Math.ceil(maxMax(maxMin)/60));
  const rowStart = startH * 60;
  const rowEnd = endH * 60;

  function maxMax(x) { return Math.max(0, x); }

  const HOUR_H = window.matchMedia('(max-width: 640px)').matches ? 40
                : window.matchMedia('(min-width: 900px)').matches ? 60
                : 50;

  const totalPersonCols = cols.reduce((s,c) => s + c.mission.quota, 0);

  grid.style.gridTemplateColumns = `62px repeat(${totalPersonCols}, minmax(64px, 1fr))`;
  const contentH = ((rowEnd - rowStart) / 60) * HOUR_H;
  grid.style.gridTemplateRows = `auto auto auto ${contentH}px`;

  /* ---------- Niveau 1 : Événement + statut ---------- */
  const h1 = document.createElement('div');
  h1.className = 'head-ev';
  h1.style.gridRow = '1';
  h1.style.gridColumn = '1';
  h1.style.background = '#7f8c8d';
  h1.textContent = 'Heure';
  grid.appendChild(h1);

  const evSpans = new Map();
  cols.forEach(c => {
    if (!evSpans.has(c.ev.id)) evSpans.set(c.ev.id, { ev: c.ev, span: 0 });
    evSpans.get(c.ev.id).span += c.mission.quota;
  });

  let colIdx = 2;
  evSpans.forEach(({ ev, span }) => {
    const status = eventDayStatus(dateStr, ev);
    const el = document.createElement('div');
    el.className = 'head-ev';
    el.style.gridRow = '1';
    el.style.gridColumn = `${colIdx} / span ${span}`;
    el.style.background = ev.color || '#3498db';
    el.innerHTML = `
      <span class="ev-status-dot" style="background:${STATUS_COLOR[status]};"></span>
      ${ev.name}
    `;
    grid.appendChild(el);
    colIdx += span;
  });

  /* ---------- Niveau 2 : Mission + statut ---------- */
  const h2 = document.createElement('div');
  h2.className = 'head-mi';
  h2.style.gridRow = '2';
  h2.style.gridColumn = '1';
  h2.style.background = '#ecf0f1';
  grid.appendChild(h2);

  colIdx = 2;
  cols.forEach(c => {
    const status = missionDayStatus(dateStr, c.mission);
    const el = document.createElement('div');
    el.className = 'head-mi';
    el.style.gridRow = '2';
    el.style.gridColumn = `${colIdx} / span ${c.mission.quota}`;
    el.style.background = shade(c.mission.color || c.ev.color || '#3498db', 0.8);
    el.innerHTML = `
      <span class="mi-status-dot" style="background:${STATUS_COLOR[status]};"></span>
      ${c.mission.name} · ${c.mission.quota}
    `;
    grid.appendChild(el);
    colIdx += c.mission.quota;
  });

  /* ---------- Niveau 3 : M1..Mn ---------- */
  const h3 = document.createElement('div');
  h3.className = 'head-person';
  h3.style.gridRow = '3';
  h3.style.gridColumn = '1';
  grid.appendChild(h3);

  colIdx = 2;
  cols.forEach(c => {
    for (let p = 1; p <= c.mission.quota; p++) {
      const el = document.createElement('div');
      el.className = 'head-person';
      el.style.gridRow = '3';
      el.style.gridColumn = `${colIdx}`;
      el.style.background = shade(c.mission.color || c.ev.color || '#3498db', 0.92);
      el.innerHTML = `<span class="p-slot-num">M${p}</span>`;
      grid.appendChild(el);
      colIdx++;
    }
  });

  /* ---------- Colonne horaire ---------- */
  const hourCol = document.createElement('div');
  hourCol.className = 'hour-track';
  hourCol.style.gridRow = '4';
  hourCol.style.gridColumn = '1';
  hourCol.style.position = 'sticky';
  hourCol.style.left = '0';
  hourCol.style.zIndex = '5';
  hourCol.style.height = contentH + 'px';

  for (let h = startH; h <= endH; h++) {
    const top = (h - startH) * HOUR_H;
    const tick = document.createElement('div');
    tick.className = 'hour-tick';
    tick.style.top = top + 'px';
    tick.innerHTML = `<span>${String(h).padStart(2,'0')}h</span>`;
    hourCol.appendChild(tick);
  }
  grid.appendChild(hourCol);

  /* ---------- Colonnes missions : blocs ---------- */
  const timelineByCol = cols.map(col => {
    const totalMinutes = rowEnd - rowStart;
    const arr = new Array(totalMinutes);
    for (let i = 0; i < totalMinutes; i++) {
      arr[i] = new Array(col.mission.quota).fill(null);
    }
    const shifts = getShifts(dateStr, col.mission.id);
    shifts.forEach(shift => {
      const from = Math.max(shift.start, rowStart) - rowStart;
      const to = Math.min(shift.end, rowEnd) - rowStart;
      for (let m = from; m < to; m++) {
        const row = arr[m];
        for (let p = 0; p < col.mission.quota; p++) {
          if (row[p] === null) { row[p] = { userId: shift.userId, shiftId: shift.id }; break; }
        }
      }
    });
    return { ...col, timeline: arr };
  });

  let subColIdx = 2;
  timelineByCol.forEach(col => {
    for (let p = 0; p < col.mission.quota; p++) {
      const colEl = document.createElement('div');
      colEl.className = 'mission-col';
      colEl.style.gridRow = '4';
      colEl.style.gridColumn = `${subColIdx}`;
      colEl.style.setProperty('--hour-h', HOUR_H + 'px');
      colEl.style.height = contentH + 'px';

      // Zones hors plage (hachurées) — un bloc par intervalle hors plage
      const allRangeBounds = [];
      col.ranges.forEach(r => { allRangeBounds.push(r.start, r.end); });
      const sortedBounds = [...new Set(allRangeBounds)].sort((a,b)=>a-b);
      // Hors plage = entre rowStart et rowEnd, hors des ranges autorisées
      const outSegments = [];
      let cursor = rowStart;
      col.ranges.forEach(r => {
        if (r.start > cursor) outSegments.push({ start: cursor, end: r.start });
        cursor = Math.max(cursor, r.end);
      });
      if (cursor < rowEnd) outSegments.push({ start: cursor, end: rowEnd });

      // Afficher les segments hors plage uniquement sur la 1re sous-colonne
      if (p === 0) {
        outSegments.forEach(seg => {
          const top = ((seg.start - rowStart) / 60) * HOUR_H;
          const height = ((seg.end - seg.start) / 60) * HOUR_H;
          const o = document.createElement('div');
          o.className = 'out-of-range';
          o.style.top = top + 'px';
          o.style.height = height + 'px';
          colEl.appendChild(o);
        });
      }

      // Construire les segments d'occupation
      const segments = [];
      let cur = null;
      for (let i = 0; i < col.timeline.length; i++) {
        const slot = col.timeline[i][p];
        const minute = rowStart + i;
        const inRange = col.ranges.some(r => minute >= r.start && minute < r.end);
        const state = !inRange ? 'out' : (slot ? 'taken' : 'free');
        const userId = slot ? slot.userId : null;
        const shiftId = slot ? slot.shiftId : null;

        if (!cur || cur.state !== state || cur.userId !== userId || cur.shiftId !== shiftId) {
          if (cur) segments.push(cur);
          cur = { start: minute, end: minute + 1, state, userId, shiftId };
        } else {
          cur.end = minute + 1;
        }
      }
      if (cur) segments.push(cur);

      segments.forEach(seg => {
        if (seg.state === 'out') return;
        // Pour les zones "free", on n'affiche le bloc QUE sur la 1re sous-colonne
        if (seg.state === 'free' && p !== 0) return;

        const top = ((seg.start - rowStart) / 60) * HOUR_H;
        const height = Math.max(3, ((seg.end - seg.start) / 60) * HOUR_H - 1);
        const block = document.createElement('div');
        block.className = 'block ' + (
          seg.state === 'taken'
            ? (seg.userId === CURRENT_USER.id ? 'mine' : 'taken')
            : 'free'
        );
        if (locked) block.classList.add('locked');
        block.style.top = top + 'px';
        block.style.height = height + 'px';

        const label = seg.state === 'taken'
          ? (USERS[seg.userId] || '?')
          : 'Libre';
        const timeLabel = `${fmtHMfull(seg.start)}–${fmtHMfull(seg.end)}`;

        block.innerHTML = `
          <div class="block-label">${label}</div>
          <div class="block-time">${timeLabel}</div>
        `;

        if (!locked) {
          block.addEventListener('click', (e) => {
            e.stopPropagation();
            openSlotModal(dateStr, col, seg.start);
          });
        }

        colEl.appendChild(block);
      });

      grid.appendChild(colEl);
      subColIdx++;
    }
  });
}

function shade(hex, factor) {
  hex = (hex || '#3498db').replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
  const r = parseInt(hex.substr(0,2),16);
  const g = parseInt(hex.substr(2,2),16);
  const b = parseInt(hex.substr(4,2),16);
  const nr = Math.round(r*factor + 255*(1-factor));
  const ng = Math.round(g*factor + 255*(1-factor));
  const nb = Math.round(b*factor + 255*(1-factor));
  return '#' + [nr,ng,nb].map(v => v.toString(16).padStart(2,'0')).join('');
}

/* =====================================================================
   MODAL — création directe / modification directe si clic sur "mine"
   ===================================================================== */
function openSlotModal(dateStr, col, clickedMinute) {
  const { mission, ranges } = col;
  const modal = document.getElementById('modal');
  const title = document.getElementById('modalTitle');
  const body = document.getElementById('modalBody');
  const actions = document.getElementById('modalActions');

  // Vérifier si l'utilisateur a un shift ici (mission courante)
  const myShiftHere = getShifts(dateStr, mission.id)
    .find(s => s.userId === CURRENT_USER.id && clickedMinute >= s.start && clickedMinute < s.end);

  const dateObj = parseDate(dateStr);
  const dateLabel = dateObj.toLocaleDateString('fr-FR', {
    weekday: 'long', day: 'numeric', month: 'long'
  });

  // ---- CAS 1 : clic sur MON propre shift -> modification directe
  if (myShiftHere) {
    title.textContent = 'Mon créneau';
    body.innerHTML = `
      <div class="slot-info">
        <strong>${col.ev.name}</strong><br>
        ${mission.name} · ${dateLabel}<br>
        <span style="color:var(--mine);font-weight:700;">${fmtHMfull(myShiftHere.start)} → ${fmtHMfull(myShiftHere.end)}</span>
      </div>
      <label for="inputStart">Heure de début</label>
      <input type="time" id="inputStart" value="${minToTimeStr(myShiftHere.start)}" min="${minToTimeStr(ranges[0].start)}" max="${minToTimeStr(ranges[ranges.length-1].end)}" step="60">
      <label for="inputEnd">Heure de fin</label>
      <input type="time" id="inputEnd" value="${minToTimeStr(myShiftHere.end)}" min="${minToTimeStr(ranges[0].start)}" max="${minToTimeStr(ranges[ranges.length-1].end)}" step="60">
      <div class="error" id="modalError"></div>
    `;
    actions.innerHTML = '';

    const btnSave = document.createElement('button');
    btnSave.className = 'btn-primary';
    btnSave.textContent = 'Enregistrer';
    btnSave.onclick = () => {
      const ns = timeStrToMin(document.getElementById('inputStart').value);
      const ne = timeStrToMin(document.getElementById('inputEnd').value);
      if (ne <= ns) { showErr('Fin doit être après début.'); return; }
      if (!shiftWithinRanges(ns, ne, ranges)) { showErr('Hors plage autorisée.'); return; }
      // Vérif conflit avec autres missions du jour
      const conflict = userHasOverlapAnyMission(dateStr, CURRENT_USER.id, ns, ne, myShiftHere.id);
      if (conflict) {
        showErr(`Conflit avec ${conflict.mission.name} (${conflict.ev.name}) ${fmtHMfull(conflict.shift.start)}→${fmtHMfull(conflict.shift.end)}.`);
        return;
      }
      // Vérif capacité sur la mission
      for (let mm = ns; mm < ne; mm++) {
        let count = 0;
        getShifts(dateStr, mission.id).forEach(s => {
          if (s.id === myShiftHere.id) return;
          if (mm >= s.start && mm < s.end) count++;
        });
        if (count >= mission.quota) {
          showErr(`Capacité atteinte à ${fmtHMfull(mm)}.`); return;
        }
      }
      myShiftHere.start = ns; myShiftHere.end = ne;
      closeModal();
      renderDayGrid();
    };
    actions.appendChild(btnSave);

    const btnDel = document.createElement('button');
    btnDel.className = 'btn-danger';
    btnDel.textContent = 'Supprimer';
    btnDel.onclick = () => {
      if (!confirm('Supprimer ce créneau ?')) return;
      const key = `${dateStr}|${mission.id}`;
      bookings[key] = getShifts(dateStr, mission.id).filter(s => s.id !== myShiftHere.id);
      closeModal();
      renderDayGrid();
    };
    actions.appendChild(btnDel);

    const btnCancel = document.createElement('button');
    btnCancel.className = 'btn-cancel';
    btnCancel.textContent = 'Fermer';
    btnCancel.onclick = closeModal;
    actions.appendChild(btnCancel);

    modal.classList.add('active');
    return;
  }

  // ---- CAS 2 : clic sur une zone libre -> création
  const containingRange = ranges.find(r => clickedMinute >= r.start && clickedMinute < r.end)
    || ranges.find(r => clickedMinute < r.end) || ranges[0];
  let defaultStart = Math.max(containingRange.start, clickedMinute);
  if (defaultStart >= containingRange.end) defaultStart = containingRange.start;
  let defaultEnd = Math.min(containingRange.end, defaultStart + 60);

  title.textContent = 'Prendre une garde';
  body.innerHTML = `
    <div class="slot-info">
      <strong>${col.ev.name}</strong><br>
      ${mission.name} · ${dateLabel}<br>
      Quota : ${mission.quota} personne(s) simultanée(s)<br>
      Plage : ${ranges.map(r => `${fmtHM(r.start)}→${fmtHM(r.end)}`).join(', ')}
    </div>
    <label for="inputStart">Heure de début</label>
    <input type="time" id="inputStart" value="${minToTimeStr(defaultStart)}" min="${minToTimeStr(containingRange.start)}" max="${minToTimeStr(containingRange.end)}" step="60">
    <label for="inputEnd">Heure de fin</label>
    <input type="time" id="inputEnd" value="${minToTimeStr(defaultEnd)}" min="${minToTimeStr(containingRange.start)}" max="${minToTimeStr(containingRange.end)}" step="60">
    <div class="error" id="modalError"></div>
  `;
  actions.innerHTML = '';

  const btnTake = document.createElement('button');
  btnTake.className = 'btn-primary btn-block';
  btnTake.textContent = "Je m'inscris";
  btnTake.onclick = () => {
    const start = timeStrToMin(document.getElementById('inputStart').value);
    const end = timeStrToMin(document.getElementById('inputEnd').value);
    if (end <= start) { showErr('Fin doit être après début.'); return; }
    if (!shiftWithinRanges(start, end, ranges)) { showErr('Hors plage autorisée.'); return; }

    // NOUVEAU : conflit avec N'IMPORTE QUELLE autre mission du jour
    const conflict = userHasOverlapAnyMission(dateStr, CURRENT_USER.id, start, end, null);
    if (conflict) {
      showErr(`Vous avez déjà ${conflict.mission.name} (${conflict.ev.name}) sur ${fmtHMfull(conflict.shift.start)}→${fmtHMfull(conflict.shift.end)}.`);
      return;
    }

    // Capacité de la mission
    for (let mm = start; mm < end; mm++) {
      if (coverAt(dateStr, mission.id, mm) >= mission.quota) {
        showErr(`Capacité atteinte à ${fmtHMfull(mm)}.`); return;
      }
    }

    const key = `${dateStr}|${mission.id}`;
    if (!bookings[key]) bookings[key] = [];
    bookings[key].push({ id: nextId(), userId: CURRENT_USER.id, start, end });
    closeModal();
    renderDayGrid();
  };
  actions.appendChild(btnTake);

  const btnCancel = document.createElement('button');
  btnCancel.className = 'btn-cancel';
  btnCancel.textContent = 'Fermer';
  btnCancel.onclick = closeModal;
  actions.appendChild(btnCancel);

  modal.classList.add('active');
}

function showErr(msg) {
  const el = document.getElementById('modalError');
  if (el) el.textContent = msg;
}
function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

/* =====================================================================
   MON PLANNING
   ===================================================================== */
function openMyPlanning() {
  document.getElementById('calendarView').style.display = 'none';
  document.getElementById('dayView').classList.remove('active');
  document.getElementById('myPlanningView').classList.add('active');
  document.getElementById('tabPlanning').classList.remove('active');
  document.getElementById('tabMyPlanning').classList.add('active');
  myPlanningDate = new Date();
  renderMyPlanning();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function closeMyPlanning() {
  document.getElementById('myPlanningView').classList.remove('active');
  document.getElementById('calendarView').style.display = 'block';
  document.getElementById('tabMyPlanning').classList.remove('active');
  document.getElementById('tabPlanning').classList.add('active');
  renderCalendar();
}

function renderMyPlanning() {
  const grid = document.getElementById('gcalGrid');
  grid.innerHTML = '';

  const monday = (() => {
    const d = new Date(myPlanningDate);
    const day = d.getDay() === 0 ? 6 : d.getDay() - 1;
    d.setDate(d.getDate() - day);
    d.setHours(0,0,0,0);
    return d;
  })();
  const sunday = addDays(monday, 6);

  document.getElementById('mpLabel').textContent =
    `${monday.toLocaleDateString('fr-FR', { day:'numeric', month:'short' })} → ` +
    `${sunday.toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' })}`;

  const shiftsByDay = {};
  for (let i = 0; i < 7; i++) {
    const dateStr = fmtDate(addDays(monday, i));
    shiftsByDay[dateStr] = [];
    EVENTS.forEach(ev => ev.missions.forEach(m => {
      getShifts(dateStr, m.id).forEach(s => {
        if (s.userId !== CURRENT_USER.id) return;
        shiftsByDay[dateStr].push({ shift: s, mission: m, ev });
      });
    }));
  }

  const isMobile = window.matchMedia('(max-width: 640px)').matches;
  const hourH = isMobile ? 40 : 60;

  grid.style.gridTemplateColumns = `60px repeat(7, minmax(110px, 1fr))`;
  grid.style.gridTemplateRows = `auto 1fr`;

  const corner = document.createElement('div');
  corner.style.cssText = `position:sticky;top:0;left:0;z-index:7;background:#f8f9fa;border-right:2px solid var(--border);border-bottom:2px solid var(--border);`;
  grid.appendChild(corner);

  const tStr = todayStr();
  for (let i = 0; i < 7; i++) {
    const d = addDays(monday, i);
    const dateStr = fmtDate(d);
    const h = document.createElement('div');
    h.className = 'gcal-day-head' + (dateStr === tStr ? ' today' : '');
    h.innerHTML = `<div>${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'][i]}</div><div class="gcal-day-num">${d.getDate()}</div>`;
    grid.appendChild(h);
  }

  const hourCol = document.createElement('div');
  hourCol.className = 'gcal-hour-col';
  hourCol.style.gridRow = '2';
  hourCol.style.gridColumn = '1';
  for (let h = 0; h < 24; h++) {
    const c = document.createElement('div');
    c.className = 'gcal-hour-cell';
    c.style.height = hourH + 'px';
    c.textContent = `${String(h).padStart(2,'0')}h`;
    hourCol.appendChild(c);
  }
  grid.appendChild(hourCol);

  for (let i = 0; i < 7; i++) {
    const d = addDays(monday, i);
    const dateStr = fmtDate(d);
    const col = document.createElement('div');
    col.className = 'gcal-day-col';
    col.style.gridRow = '2';
    col.style.gridColumn = `${i+2}`;

    const slots = document.createElement('div');
    slots.className = 'gcal-slots';
    slots.style.height = (24 * hourH) + 'px';

    shiftsByDay[dateStr].forEach(({ shift, mission, ev }) => {
      const top = (shift.start / 60) * hourH;
      const height = Math.max(20, ((shift.end - shift.start) / 60) * hourH - 1);
      const el = document.createElement('div');
      el.className = 'gcal-event';
      el.style.top = top + 'px';
      el.style.height = height + 'px';
      el.style.background = mission.color || ev.color || '#3498db';
      el.innerHTML = `
        <div class="ev-time">${fmtHMfull(shift.start)}–${fmtHMfull(shift.end)}</div>
        <div class="ev-title">${ev.name}</div>
        <div class="ev-role">${mission.name}</div>
      `;
      el.addEventListener('click', () => openShiftActions(dateStr, mission, ev, shift));
      slots.appendChild(el);
    });

    col.appendChild(slots);
    grid.appendChild(col);
  }
}

function openShiftActions(dateStr, mission, ev, shift) {
  // Ouvre la vue jour + le modal du shift directement
  openDayView(dateStr);
  setTimeout(() => {
    const ranges = missionRangesForDate(mission, dateStr);
    openSlotModal(dateStr, { ev, mission, ranges }, shift.start);
  }, 200);
}

/* =====================================================================
   UI
   ===================================================================== */
document.getElementById('calPrev').onclick = () => {
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1);
  renderCalendar();
};
document.getElementById('calNext').onclick = () => {
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1);
  renderCalendar();
};
document.getElementById('calToday').onclick = () => {
  calMonth = new Date();
  renderCalendar();
};
document.getElementById('btnBack').onclick = closeDayView;

document.getElementById('tabPlanning').onclick = () => {
  if (document.getElementById('dayView').classList.contains('active')) return;
  closeMyPlanning();
};
document.getElementById('tabMyPlanning').onclick = () => {
  if (document.getElementById('myPlanningView').classList.contains('active')) return;
  openMyPlanning();
};

document.getElementById('mpPrev').onclick = () => { myPlanningDate = addDays(myPlanningDate, -7); renderMyPlanning(); };
document.getElementById('mpNext').onclick = () => { myPlanningDate = addDays(myPlanningDate, 7); renderMyPlanning(); };
document.getElementById('mpToday').onclick = () => { myPlanningDate = new Date(); renderMyPlanning(); };
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

loadEvents();
</script>
</body>
