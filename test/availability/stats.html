<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Statistiques — Administration</title>
<link rel="stylesheet" href="./style.css">
<style>
  .stats-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .stats-panel h3 {
    font-size: 1em; font-weight: 700;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .stats-panel .hint { font-size: 0.85em; color: var(--text-muted); }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 0.75rem;
  }
  .kpi {
    background: var(--card-hover);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.85rem 1rem;
  }
  .kpi-label {
    font-size: 0.72em; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
  }
  .kpi-value {
    font-size: 1.75em; font-weight: 700;
    margin-top: 0.2rem; color: var(--text);
    line-height: 1.15;
  }
  .kpi-sub { font-size: 0.75em; color: var(--text-muted); margin-top: 0.2rem; }
  .kpi.accent { border-left: 4px solid var(--accent); }
  .kpi.warn { border-left: 4px solid var(--warning); }
  .kpi.danger { border-left: 4px solid var(--error); }
  .kpi.success { border-left: 4px solid var(--success); }

  .section-title {
    font-size: 0.85em; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted);
    margin: 0.5rem 0 0.25rem;
  }

  .list-item {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.65rem 0.85rem;
    background: var(--card-hover);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    border-left-width: 4px;
  }
  .list-item + .list-item { margin-top: 0.5rem; }
  .list-item .item-main { flex: 1; min-width: 0; }
  .list-item .item-title {
    font-weight: 600; font-size: 0.92em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .list-item .item-meta {
    font-size: 0.78em; color: var(--text-muted);
    display: flex; gap: 0.65rem; flex-wrap: wrap; margin-top: 0.15rem;
  }
  .list-item .item-badge {
    font-size: 0.75em; font-weight: 700;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge-danger { background: color-mix(in srgb, var(--error) 18%, transparent); color: var(--error); }
  .badge-warn { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }
  .badge-ok { background: color-mix(in srgb, var(--success) 18%, transparent); color: var(--success); }
  .badge-muted { background: var(--field); color: var(--text-muted); }

  .empty {
    text-align: center; padding: 1.5rem 1rem;
    color: var(--text-muted); font-size: 0.9em;
  }

  /* Barres horizontales (top utilisateurs, jours, heures) */
  .bar-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .bar-row { display: flex; align-items: center; gap: 0.75rem; }
  .bar-label {
    width: 130px; flex-shrink: 0;
    font-size: 0.85em; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bar-track {
    flex: 1; height: 22px;
    background: var(--field);
    border-radius: 4px; overflow: hidden;
    position: relative;
    border: 1px solid var(--border);
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 70%, var(--success)));
    border-radius: 4px;
    transition: width 0.3s;
  }
  .bar-value {
    min-width: 70px; text-align: right;
    font-size: 0.82em; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* Heatmap horaire (0h → 23h) */
  .heatmap {
    display: grid;
    grid-template-columns: repeat(24, 1fr);
    gap: 2px;
    margin-top: 0.5rem;
  }
  .hm-cell {
    aspect-ratio: 1;
    border-radius: 3px;
    position: relative;
    cursor: default;
    min-height: 22px;
  }
  .hm-labels {
    display: grid;
    grid-template-columns: repeat(24, 1fr);
    gap: 2px;
    margin-top: 0.35rem;
    font-size: 0.65em;
    color: var(--text-muted);
    text-align: center;
  }
  .hm-labels span {
    font-variant-numeric: tabular-nums;
  }

  /* Heatmap calendrier (type GitHub) */
  .calendar-heatmap {
    display: flex; gap: 3px;
    overflow-x: auto;
    padding-bottom: 0.5rem;
  }
  .ch-week {
    display: flex; flex-direction: column; gap: 3px;
  }
  .ch-day {
    width: 14px; height: 14px;
    border-radius: 3px;
    background: var(--field);
    border: 1px solid var(--border);
    position: relative;
  }
  .ch-legend {
    display: flex; gap: 0.35rem; align-items: center;
    font-size: 0.72em; color: var(--text-muted);
    margin-top: 0.5rem;
  }
  .ch-legend .ch-day { width: 12px; height: 12px; }

  /* Recherche utilisateur */
  .search-bar {
    display: flex; gap: 0.5rem; flex-wrap: wrap;
  }
  .search-bar input {
    flex: 1; min-width: 200px;
    font-family: inherit; font-size: 1em;
    padding: 0.6rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    background: var(--field); color: var(--text);
    outline: none;
  }
  .search-bar input:focus { border-color: var(--accent); }

  .user-picker {
    display: flex; gap: 0.4rem; flex-wrap: wrap;
  }
  .user-chip {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.4rem 0.8rem;
    background: var(--card-hover);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 0.82em;
    cursor: pointer;
    transition: all .15s;
  }
  .user-chip:hover { border-color: var(--text); }
  .user-chip.active {
    background: var(--accent); color: var(--accent-text);
    border-color: var(--accent);
  }
  .user-chip .avatar {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-text);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.75em; font-weight: 700;
  }
  .user-chip.active .avatar {
    background: var(--accent-text); color: var(--accent);
  }

  /* Planning perso d'un user */
  .user-planning-list {
    display: flex; flex-direction: column; gap: 0.6rem;
    margin-top: 0.75rem;
  }
  .user-shift {
    display: flex; gap: 0.75rem;
    padding: 0.6rem 0.85rem;
    background: var(--card-hover);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    border-left-width: 4px;
    align-items: flex-start;
  }
  .user-shift .shift-date {
    min-width: 100px;
    font-size: 0.82em; font-weight: 700;
    color: var(--text);
  }
  .user-shift .shift-mission {
    font-weight: 600; font-size: 0.88em;
  }
  .user-shift .shift-time {
    font-size: 0.82em; color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .loader {
    text-align: center; padding: 3rem 1rem;
    color: var(--text-muted); font-size: 0.9em;
  }

  .filters-row {
    display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
  }
  .filters-row select {
    font-family: inherit; font-size: 0.85em;
    padding: 0.45rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    background: var(--field); color: var(--text);
  }

  .toggle-group {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    overflow: hidden;
    background: var(--card-hover);
  }
  .toggle-group button {
    font-size: 0.82em; font-weight: 600;
    padding: 0.45rem 0.85rem;
    background: transparent; color: var(--text-muted);
    border: none; cursor: pointer;
  }
  .toggle-group button.active {
    background: var(--accent); color: var(--accent-text);
  }

  .table-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
  }
  table.stats-table {
    width: 100%; border-collapse: collapse;
    font-size: 0.85em;
    min-width: 500px;
  }
  table.stats-table th {
    background: var(--card-hover);
    text-align: left;
    padding: 0.6rem 0.75rem;
    font-weight: 700; font-size: 0.85em;
    color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.03em;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.stats-table td {
    padding: 0.6rem 0.75rem;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  table.stats-table tr:last-child td { border-bottom: none; }
  table.stats-table tr:hover td { background: var(--card-hover); }
  table.stats-table td.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  @media (max-width: 640px) {
    .bar-label { width: 90px; font-size: 0.78em; }
    .bar-value { min-width: 55px; font-size: 0.75em; }
    .kpi-value { font-size: 1.4em; }
    .heatmap { grid-template-columns: repeat(12, 1fr); }
    .hm-labels { grid-template-columns: repeat(12, 1fr); }
  }
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, collection
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

/* =====================================================================
   FIREBASE
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBulM5-30n3SoH7zT7nxDBvB42Pu4c3qSs",
  authDomain: "mdl-et-cvl-2027.firebaseapp.com",
  projectId: "mdl-et-cvl-2027",
  storageBucket: "mdl-et-cvl-2027.firebasestorage.app",
  messagingSenderId: "142816093888",
  appId: "1:142816093888:web:9f7c3632732a526b7c2f25",
  measurementId: "G-FBKEPBY0CQ"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const LOGIN_URL = 'https://account.honore-romane.fr/login/';
const CURRENT_URL = 'https://account.honore-romane.fr/tools/planning/stats/';
const COLLECTION = 'plannings_gardes';

const DAY_LABELS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

/* =====================================================================
   STATE
   ===================================================================== */
let ME = null;
let EVENTS = [];
let ARCHIVE = {};                       // gardes.json
let FIRESTORE_DATA = {};                // dateStr → { missionId: [[id,uid,start,end],...] }
const MERGED = {};                      // dateStr → { missionId: [...] } (fusionné)
const USERS = {};                       // uid → { uid, name, email, ... }
let selectedUserId = null;

/* =====================================================================
   UTILITAIRES
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseDate(s) { return new Date(s + 'T00:00:00'); }
function todayStr() { return fmtDate(new Date()); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function jsDayToOur(d) { const j = d.getDay(); return j === 0 ? 7 : j; }
function isLocked(dateStr) {
  const t = new Date(); t.setHours(0,0,0,0);
  return (parseDate(dateStr) - t) / 86400000 <= 1;
}
function fmtHM(min) {
  const h = Math.floor(min/60); const m = min % 60;
  return `${String(h).padStart(2,'0')}h${m ? String(m).padStart(2,'0') : ''}`;
}
function fmtHMfull(min) {
  return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`;
}
function fmtDuration(minutes) {
  if (minutes < 60) return `${minutes} min`;
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return m ? `${h}h${String(m).padStart(2,'0')}` : `${h}h`;
}
function fmtDateLong(dateStr) {
  return parseDate(dateStr).toLocaleDateString('fr-FR', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });
}

/* =====================================================================
   LOGIQUE EVENTS
   ===================================================================== */
function eventsForDate(dateStr) {
  const d = parseDate(dateStr);
  const dayNum = jsDayToOur(d);
  return EVENTS.filter(ev => {
    if (ev.type === 'punctual') return ev.specificDate === dateStr;
    if (ev.type === 'recurring') return ev.recurrence && ev.recurrence.days.includes(dayNum);
    return false;
  });
}

function missionRangesForDate(mission, dateStr) {
  const dayNum = jsDayToOur(parseDate(dateStr));
  const out = [];
  (mission.ranges || []).forEach(r => {
    if (r.excludeOn && r.excludeOn.includes(dayNum)) return;
    out.push({ start: r.start*60, end: r.end*60 });
  });
  out.sort((a,b)=>a.start-b.start);
  const merged = [];
  out.forEach(r => {
    if (merged.length && r.start <= merged[merged.length-1].end) {
      merged[merged.length-1].end = Math.max(merged[merged.length-1].end, r.end);
    } else merged.push({ ...r });
  });
  return merged;
}

function getShifts(dateStr, missionId) {
  const day = MERGED[dateStr];
  if (!day) return [];
  return day[missionId] || [];
}

function coverAt(dateStr, missionId, minute) {
  let total = 0;
  for (const s of getShifts(dateStr, missionId)) {
    if (minute >= s[2] && minute < s[3]) total++;
  }
  return total;
}

/* Statut mission sur la journée : 'full' | 'partial' | 'empty' */
function missionDayStatus(dateStr, mission) {
  const ranges = missionRangesForDate(mission, dateStr);
  if (ranges.length === 0) return 'empty';
  let totalMin = 0, coveredMin = 0;
  ranges.forEach(r => {
    for (let m = r.start; m < r.end; m++) {
      totalMin++;
      if (coverAt(dateStr, mission.id, m) >= mission.quota) coveredMin++;
    }
  });
  if (coveredMin === 0) return 'empty';
  if (coveredMin === totalMin) return 'full';
  return 'partial';
}

/* Renvoie le nombre de minutes non couvertes (0 si complet) */
function missionMissingMinutes(dateStr, mission) {
  const ranges = missionRangesForDate(mission, dateStr);
  let missing = 0;
  let totalMin = 0;
  ranges.forEach(r => {
    for (let m = r.start; m < r.end; m++) {
      totalMin++;
      const cover = coverAt(dateStr, mission.id, m);
      if (cover < mission.quota) missing += (mission.quota - cover);
    }
  });
  return { missing, totalMin };
}

/* =====================================================================
   CHARGEMENT
   ===================================================================== */
async function loadStaticFiles() {
  // events.json
  try {
    const res = await fetch('./events.json', { cache: 'no-cache' });
    if (res.ok) EVENTS = (await res.json()).events || [];
  } catch (e) { console.info('events.json absent', e.message); }

  // gardes.json
  try {
    const res = await fetch('./gardes.json', { cache: 'no-cache' });
    if (res.ok) {
      const data = await res.json();
      ARCHIVE = (data && typeof data === 'object' && !Array.isArray(data)) ? data : {};
    }
  } catch (e) { console.info('gardes.json absent', e.message); }
}

async function loadFirestore() {
  try {
    const snap = await getDocs(collection(db, COLLECTION));
    FIRESTORE_DATA = {};
    snap.forEach(d => {
      const data = d.data();
      if (data && data.s && typeof data.s === 'object') {
        const missions = {};
        for (const [missionId, arr] of Object.entries(data.s)) {
          if (Array.isArray(arr)) {
            missions[missionId] = arr
              .filter(row => Array.isArray(row) && row.length >= 4)
              .map(row => [String(row[0]||''), String(row[1]||''), Number(row[2])||0, Number(row[3])||0]);
          }
        }
        FIRESTORE_DATA[d.id] = missions;
      }
    });
  } catch (e) {
    console.error('Firestore load error', e);
  }
}

async function loadUsers() {
  try {
    const snap = await getDocs(collection(db, 'users'));
    snap.forEach(d => {
      const data = d.data();
      USERS[d.id] = {
        uid: d.id,
        name: data.name || data.displayName || data.email || d.id.slice(0, 8),
        email: data.email || '',
        status: data.status || '',
        role: data.role || '',
        isAdmin: data.isAdmin === true
      };
    });
  } catch (e) {
    console.error('Users load error', e);
  }
}

/* Fusion archive + firestore (Firestore prioritaire) */
function buildMerged() {
  Object.keys(MERGED).forEach(k => delete MERGED[k]);
  for (const [dateStr, missions] of Object.entries(ARCHIVE)) {
    if (!missions || typeof missions !== 'object') continue;
    MERGED[dateStr] = {};
    for (const [mid, arr] of Object.entries(missions)) {
      if (Array.isArray(arr)) MERGED[dateStr][mid] = arr.map(s => [...s]);
    }
  }
  for (const [dateStr, missions] of Object.entries(FIRESTORE_DATA)) {
    if (!MERGED[dateStr]) MERGED[dateStr] = {};
    for (const [mid, arr] of Object.entries(missions)) {
      MERGED[dateStr][mid] = arr.map(s => [...s]);
    }
  }
}

/* =====================================================================
   CALCUL STATS
   ===================================================================== */
function getUserName(uid) {
  if (USERS[uid]) return USERS[uid].name;
  if (uid === ME.uid) return ME.name;
  return uid.slice(0, 8);
}

/* Toutes les dates connues (union archive + firestore), triées */
function allKnownDates() {
  return Object.keys(MERGED).sort();
}

/* Toutes les missions rencontrées (uniques par id) */
function allMissions() {
  const map = new Map();
  EVENTS.forEach(ev => ev.missions.forEach(m => {
    if (!map.has(m.id)) map.set(m.id, { mission: m, event: ev });
  }));
  return map;
}

/* Total minutes par utilisateur (sur toutes les dates connues) */
function computeUserTotals() {
  const totals = {};    // uid → { minutes, shifts, missions, events: Set, dates: Set }
  for (const dateStr of allKnownDates()) {
    const day = MERGED[dateStr];
    if (!day) continue;
    for (const [missionId, arr] of Object.entries(day)) {
      for (const s of arr) {
        const uid = s[1];
        if (!uid) continue;
        const dur = s[3] - s[2];
        if (dur <= 0) continue;
        if (!totals[uid]) totals[uid] = {
          minutes: 0, shifts: 0,
          events: new Set(), missions: new Set(), dates: new Set()
        };
        totals[uid].minutes += dur;
        totals[uid].shifts++;
        totals[uid].dates.add(dateStr);
        totals[uid].missions.add(missionId);
        // trouver l'event
        const found = allMissions().get(missionId);
        if (found) totals[uid].events.add(found.event.id);
      }
    }
  }
  return totals;
}

/* Répartition par heure (heatmap) */
function computeHourlyCoverage() {
  const hours = new Array(24).fill(0);
  for (const dateStr of allKnownDates()) {
    const day = MERGED[dateStr];
    if (!day) continue;
    for (const arr of Object.values(day)) {
      for (const s of arr) {
        const startH = Math.floor(s[2] / 60);
        const endH = Math.ceil(s[3] / 60);
        for (let h = startH; h < endH; h++) hours[h]++;
      }
    }
  }
  return hours;
}

/* Activité par jour (heatmap calendrier) */
function computeDailyActivity() {
  const activity = {};
  for (const dateStr of allKnownDates()) {
    const day = MERGED[dateStr];
    if (!day) { activity[dateStr] = 0; continue; }
    let count = 0;
    for (const arr of Object.values(day)) count += arr.length;
    activity[dateStr] = count;
  }
  return activity;
}

/* Prochains événements avec places manquantes */
function computeUpcomingGaps(daysAhead = 14) {
  const t = new Date(); t.setHours(0,0,0,0);
  const out = [];
  for (let i = 0; i < daysAhead; i++) {
    const d = addDays(t, i);
    const dateStr = fmtDate(d);
    const evs = eventsForDate(dateStr);
    for (const ev of evs) {
      for (const m of ev.missions) {
        const { missing, totalMin } = missionMissingMinutes(dateStr, m);
        if (missing > 0) {
          out.push({
            dateStr, dayOffset: i, event: ev, mission: m,
            missingMinutes: missing, totalMinutes: totalMin,
            pctMissing: Math.round((missing / (totalMin * m.quota)) * 100)
          });
        }
      }
    }
  }
  return out.sort((a,b) => a.dateStr.localeCompare(b.dateStr) || a.event.name.localeCompare(b.event.name));
}

/* Taux de remplissage global (sur dates futures et passées) */
function computeFillRate() {
  const dates = allKnownDates();
  let totalSlots = 0, filledSlots = 0;
  let totalMinutes = 0, missingMinutes = 0;
  for (const dateStr of dates) {
    for (const ev of eventsForDate(dateStr)) {
      for (const m of ev.missions) {
        const ranges = missionRangesForDate(m, dateStr);
        ranges.forEach(r => {
          for (let minute = r.start; minute < r.end; minute++) {
            totalSlots += m.quota;
            totalMinutes += 1;
            const cover = coverAt(dateStr, m.id, minute);
            filledSlots += Math.min(cover, m.quota);
            if (cover < m.quota) missingMinutes += (m.quota - cover);
          }
        });
      }
    }
  }
  return {
    fillRate: totalSlots ? Math.round((filledSlots / totalSlots) * 100) : 0,
    totalSlots, filledSlots, missingMinutes, totalMinutes
  };
}

/* Planning personnel d'un utilisateur */
function getUserShifts(uid) {
  const out = [];
  for (const dateStr of allKnownDates()) {
    const day = MERGED[dateStr];
    if (!day) continue;
    for (const [missionId, arr] of Object.entries(day)) {
      for (const s of arr) {
        if (s[1] !== uid) continue;
        const found = allMissions().get(missionId);
        out.push({
          dateStr, shift: s,
          mission: found ? found.mission : { id: missionId, name: missionId },
          event: found ? found.event : { id: missionId, name: missionId, color: '#7f8c8d' }
        });
      }
    }
  }
  return out.sort((a,b) => a.dateStr.localeCompare(b.dateStr) || a.shift[2] - b.shift[2]);
}

/* Liste des users ayant au moins un shift */
function usersWithShifts() {
  const totals = computeUserTotals();
  return Object.keys(totals).sort((a,b) => totals[b].minutes - totals[a].minutes);
}

/* Mission la plus/moins demandée : minutes totales couvertes par mission */
function computeMissionTotals() {
  const map = new Map();
  for (const dateStr of allKnownDates()) {
    for (const ev of eventsForDate(dateStr)) {
      for (const m of ev.missions) {
        const ranges = missionRangesForDate(m, dateStr);
        let covered = 0;
        let required = 0;
        ranges.forEach(r => {
          for (let minute = r.start; minute < r.end; minute++) {
            const cover = coverAt(dateStr, m.id, minute);
            covered += Math.min(cover, m.quota);
            required += m.quota;
          }
        });
        const key = m.id;
        if (!map.has(key)) map.set(key, {
          mission: m, event: ev, covered: 0, required: 0
        });
        const o = map.get(key);
        o.covered += covered;
        o.required += required;
      }
    }
  }
  return [...map.values()].map(o => ({
    ...o,
    fillRate: o.required ? Math.round((o.covered / o.required) * 100) : 0
  })).sort((a,b) => b.required - a.required);
}

/* =====================================================================
   RENDU PRINCIPAL
   ===================================================================== */
function render() {
  const content = $('content');
  content.innerHTML = '';

  // ---- KPI globaux ----
  const totals = computeUserTotals();
  const userUids = Object.keys(totals);
  const totalUserMinutes = userUids.reduce((s, u) => s + totals[u].minutes, 0);
  const totalUserShifts = userUids.reduce((s, u) => s + totals[u].shifts, 0);
  const fill = computeFillRate();
  const allDates = allKnownDates();
  const futureDates = allDates.filter(d => d >= todayStr());
  const pastDates = allDates.filter(d => d < todayStr());
  const totalCapacityMinutes = fill.totalSlots * 1; // déjà en minutes-personnes

  // ---- Section KPI ----
  content.appendChild(panel('📊 Vue d\'ensemble', `
    <div class="kpi-grid">
      ${kpiCard('Jours enregistrés', allDates.length, `${pastDates.length} passé(s) · ${futureDates.length} à venir`, 'accent')}
      ${kpiCard('Utilisateurs actifs', userUids.length, `sur ${Object.keys(USERS).length} comptes`, '')}
      ${kpiCard('Gardes totales', totalUserShifts, 'toutes périodes', '')}
      ${kpiCard('Heures données', fmtDuration(totalUserMinutes), 'cumul de tous les utilisateurs', 'success')}
      ${kpiCard('Taux de remplissage', fill.fillRate + '%', `${fmtDuration(fill.missingMinutes)} à combler`, fill.fillRate >= 80 ? 'success' : fill.fillRate >= 50 ? 'warn' : 'danger')}
      ${kpiCard('Créneaux manquants', fmtDuration(fill.missingMinutes), 'personnes·minutes', 'warn')}
    </div>
  `));

  // ---- Prochains événements à combler ----
  const gaps = computeUpcomingGaps(14);
  const gapsHTML = gaps.length === 0
    ? '<div class="empty">✓ Tous les événements des 14 prochains jours sont complets.</div>'
    : gaps.slice(0, 15).map(g => {
      const dayLabel = g.dayOffset === 0 ? "Aujourd'hui" :
                       g.dayOffset === 1 ? 'Demain' :
                       parseDate(g.dateStr).toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'short' });
      const badge = g.pctMissing >= 80 ? 'badge-danger' :
                    g.pctMissing >= 40 ? 'badge-warn' : 'badge-ok';
      return `<div class="list-item" style="border-left-color:${g.event.color || '#3498db'}">
        <div class="item-main">
          <div class="item-title">${esc(g.event.name)} · ${esc(g.mission.name)}</div>
          <div class="item-meta">
            <span>📅 ${esc(dayLabel)} (${g.dateStr})</span>
            <span>⏱ ${fmtDuration(g.missingMinutes)} à combler</span>
            <span>👥 ${g.mission.quota} pers.</span>
          </div>
        </div>
        <span class="item-badge ${badge}">${g.pctMissing}% vide</span>
      </div>`;
    }).join('');

  content.appendChild(panel('🚨 Prochains créneaux à combler (14 jours)', gapsHTML,
    `${gaps.length} créneau(x) à pourvoir`));

  // ---- Top utilisateurs ----
  const topUsers = userUids.slice(0, 10);
  const maxMin = topUsers.length ? totals[topUsers[0]].minutes : 1;
  const usersHTML = topUsers.length === 0
    ? '<div class="empty">Aucune donnée utilisateur.</div>'
    : `<div class="bar-list">${topUsers.map(uid => {
        const t = totals[uid];
        const pct = Math.round((t.minutes / maxMin) * 100);
        return `<div class="bar-row">
          <div class="bar-label" title="${esc(getUserName(uid))}">${esc(getUserName(uid))}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="bar-value">${fmtDuration(t.minutes)}</div>
        </div>`;
      }).join('')}</div>`;

  content.appendChild(panel('🏆 Top utilisateurs (heures données)', usersHTML,
    `${userUids.length} utilisateur(s) avec au moins une garde`));

  // ---- Répartition horaire ----
  const hourly = computeHourlyCoverage();
  const maxHour = Math.max(...hourly, 1);
  const heatHTML = hourly.map((count, h) => {
    const intensity = count / maxHour;
    const bg = `color-mix(in srgb, var(--accent) ${Math.round(intensity * 100)}%, var(--field))`;
    return `<div class="hm-cell" style="background:${bg}" title="${h}h — ${count} shift(s)"></div>`;
  }).join('');
  const labelsHTML = hourly.map((_, h) => `<span>${h}h</span>`).join('');

  content.appendChild(panel('🕐 Répartition horaire des gardes', `
    <div class="heatmap">${heatHTML}</div>
    <div class="hm-labels">${labelsHTML}</div>
    <div class="hint" style="margin-top:0.5rem;">Nombre total de shifts commençant ou couvrant chaque heure (toutes dates).</div>
  `));

  // ---- Heatmap calendrier (type GitHub, 6 derniers mois) ----
  const activity = computeDailyActivity();
  const today = new Date(); today.setHours(0,0,0,0);
  const startHM = new Date(today);
  startHM.setMonth(startHM.getMonth() - 5);
  startHM.setDate(1);
  // aligner au lundi
  const startOffset = (startHM.getDay() + 6) % 7;
  startHM.setDate(startHM.getDate() - startOffset);

  const weeks = [];
  let curWeek = [];
  let cur = new Date(startHM);
  while (cur <= today || curWeek.length > 0) {
    curWeek.push({ date: new Date(cur), dateStr: fmtDate(cur) });
    if (cur.getDay() === 0) { // dimanche
      weeks.push(curWeek);
      curWeek = [];
    }
    cur.setDate(cur.getDate() + 1);
    if (cur > today && curWeek.length === 0) break;
    if (cur > addDays(today, 7)) break;
  }
  if (curWeek.length) weeks.push(curWeek);

  const maxAct = Math.max(...Object.values(activity), 1);
  const calHTML = weeks.map(week => {
    const daysHTML = week.map(({ date, dateStr }) => {
      const val = activity[dateStr] || 0;
      const intensity = val / maxAct;
      const bg = val === 0
        ? 'var(--field)'
        : `color-mix(in srgb, var(--success) ${Math.round(intensity * 90 + 10)}%, var(--field))`;
      return `<div class="ch-day" style="background:${bg}" title="${dateStr} — ${val} shift(s)"></div>`;
    }).join('');
    return `<div class="ch-week">${daysHTML}</div>`;
  }).join('');

  content.appendChild(panel('📅 Activité sur 6 mois', `
    <div class="calendar-heatmap">${calHTML}</div>
    <div class="ch-legend">
      <span>Moins</span>
      <div class="ch-day" style="background:var(--field);"></div>
      <div class="ch-day" style="background:color-mix(in srgb, var(--success) 30%, var(--field));"></div>
      <div class="ch-day" style="background:color-mix(in srgb, var(--success) 60%, var(--field));"></div>
      <div class="ch-day" style="background:color-mix(in srgb, var(--success) 90%, var(--field));"></div>
      <span>Plus</span>
    </div>
  `));

  // ---- Missions : taux de remplissage ----
  const missionTotals = computeMissionTotals();
  const missionsHTML = missionTotals.length === 0
    ? '<div class="empty">Aucune mission.</div>'
    : `<div class="table-wrapper"><table class="stats-table">
        <thead><tr>
          <th>Mission</th><th>Événement</th>
          <th style="text-align:right">Requis</th>
          <th style="text-align:right">Couvert</th>
          <th style="text-align:right">Remplissage</th>
        </tr></thead><tbody>
        ${missionTotals.map(m => `
          <tr>
            <td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${m.mission.color || m.event.color || '#3498db'};margin-right:0.4rem;"></span>${esc(m.mission.name)}</td>
            <td>${esc(m.event.name)}</td>
            <td class="num">${m.required} min</td>
            <td class="num">${m.covered} min</td>
            <td class="num" style="color:${m.fillRate >= 80 ? 'var(--success)' : m.fillRate >= 50 ? 'var(--warning)' : 'var(--error)'}">${m.fillRate}%</td>
          </tr>
        `).join('')}
        </tbody></table></div>`;

  content.appendChild(panel('🎯 Missions par taux de remplissage', missionsHTML));

  // ---- Sélecteur utilisateur + planning ----
  const pickerHTML = `
    <div class="search-bar">
      <input type="text" id="user-search" placeholder="Rechercher un utilisateur…">
    </div>
    <div class="user-picker" id="user-picker"></div>
    <div id="user-planning"></div>
  `;
  content.appendChild(panel('👤 Planning d\'un utilisateur', pickerHTML,
    'Cliquez sur un utilisateur pour voir son planning complet'));

  // Remplir le picker
  renderUserPicker();
}

function renderUserPicker() {
  const picker = $('user-picker');
  if (!picker) return;
  const searchEl = $('user-search');
  const search = (searchEl?.value || '').toLowerCase().trim();

  const allUids = Object.keys(USERS).sort((a,b) => {
    const na = USERS[a].name.toLowerCase();
    const nb = USERS[b].name.toLowerCase();
    return na.localeCompare(nb);
  });
  const filtered = search
    ? allUids.filter(uid => USERS[uid].name.toLowerCase().includes(search) || uid.includes(search))
    : allUids;

  picker.innerHTML = filtered.length === 0
    ? '<div class="empty" style="padding:0.75rem;font-size:0.85em;">Aucun utilisateur.</div>'
    : filtered.slice(0, 30).map(uid => {
        const u = USERS[uid];
        const initial = (u.name || '?')[0].toUpperCase();
        return `<button class="user-chip ${selectedUserId === uid ? 'active' : ''}" data-uid="${esc(uid)}">
          <span class="avatar">${initial}</span>
          ${esc(u.name)}
        </button>`;
      }).join('');

  picker.querySelectorAll('[data-uid]').forEach(btn => {
    btn.onclick = () => {
      selectedUserId = btn.dataset.uid;
      renderUserPicker();
      renderUserPlanning();
    };
  });

  if (searchEl && !searchEl._bound) {
    searchEl._bound = true;
    searchEl.addEventListener('input', () => renderUserPicker());
  }

  renderUserPlanning();
}

function renderUserPlanning() {
  const el = $('user-planning');
  if (!el) return;

  if (!selectedUserId) {
    el.innerHTML = '<div class="empty">Sélectionnez un utilisateur ci-dessus.</div>';
    return;
  }

  const u = USERS[selectedUserId] || { name: selectedUserId, uid: selectedUserId };
  const shifts = getUserShifts(selectedUserId);
  const totals = computeUserTotals()[selectedUserId] || {
    minutes: 0, shifts: 0, dates: new Set(), missions: new Set(), events: new Set()
  };

  if (shifts.length === 0) {
    el.innerHTML = `
      <div class="kpi-grid" style="margin-top:1rem;">
        ${kpiCard('Total gardes', 0, u.name, '')}
        ${kpiCard('Heures données', '0h', 'aucun engagement', '')}
      </div>
      <div class="empty" style="margin-top:1rem;">Cet utilisateur n'a aucune garde enregistrée.</div>
    `;
    return;
  }

  const grouped = {};
  shifts.forEach(s => {
    if (!grouped[s.dateStr]) grouped[s.dateStr] = [];
    grouped[s.dateStr].push(s);
  });

  const now = todayStr();
  const shiftsHTML = Object.keys(grouped).sort().map(dateStr => {
    const isPast = dateStr < now;
    const isToday = dateStr === now;
    const dayLabel = isToday ? "Aujourd'hui" :
                     parseDate(dateStr).toLocaleDateString('fr-FR', {
                       weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
                     });
    const style = isPast
      ? 'color:var(--text-muted);'
      : isToday ? 'color:var(--warning);' : 'color:var(--text);';
    const items = grouped[dateStr].map(s => {
      const dur = s.shift[3] - s.shift[2];
      return `<div class="user-shift" style="border-left-color:${s.mission.color || s.event.color || '#3498db'}">
        <div class="shift-date" style="${style}"></div>
        <div style="flex:1;min-width:0;">
          <div class="shift-mission">${esc(s.event.name)} · ${esc(s.mission.name)}</div>
          <div class="shift-time">${fmtHMfull(s.shift[2])} → ${fmtHMfull(s.shift[3])} (${fmtDuration(dur)})</div>
        </div>
      </div>`;
    }).join('');
    return `<div style="margin-top:1rem;">
      <div class="section-title" style="${style}">${esc(dayLabel)} ${isPast ? '· passé' : ''}</div>
      ${items}
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="kpi-grid" style="margin-top:1rem;">
      ${kpiCard('Total gardes', totals.shifts, u.name, '')}
      ${kpiCard('Heures données', fmtDuration(totals.minutes), `${totals.dates.size} jour(s) différent(s)`, 'success')}
      ${kpiCard('Événements', totals.events.size, `${totals.missions.size} mission(s) différente(s)`, '')}
    </div>
    <div class="user-planning-list">${shiftsHTML}</div>
  `;
}

function kpiCard(label, value, sub, cls = '') {
  return `<div class="kpi ${cls}">
    <div class="kpi-label">${esc(label)}</div>
    <div class="kpi-value">${esc(value)}</div>
    ${sub ? `<div class="kpi-sub">${esc(sub)}</div>` : ''}
  </div>`;
}

function panel(title, contentHTML, subtitle = '') {
  const section = document.createElement('section');
  section.className = 'stats-panel';
  section.innerHTML = `
    <h3>${title}</h3>
    ${subtitle ? `<div class="hint">${esc(subtitle)}</div>` : ''}
    ${contentHTML}
  `;
  return section;
}

/* =====================================================================
   INIT
   ===================================================================== */
const goToLogin = () => {
  window.location.replace(LOGIN_URL + '?redirect=' + encodeURIComponent(CURRENT_URL));
};

async function loadAll() {
  const content = $('content');
  content.innerHTML = '<div class="loader">Chargement des données…</div>';

  await Promise.all([loadStaticFiles(), loadFirestore(), loadUsers()]);
  buildMerged();
  render();
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { goToLogin(); return; }
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists() || snap.data().status !== 'active') {
      await signOut(auth);
      goToLogin();
      return;
    }
    ME = { uid: user.uid, name: snap.data().name || user.email || 'Vous' };
    await loadAll();
  } catch (err) {
    console.error(err);
    await signOut(auth).catch(() => {});
    goToLogin();
  }
});

$('logout-btn').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  btn.disabled = true;
  btn.textContent = 'Déconnexion…';
  try { await signOut(auth); }
  catch (err) { console.error(err); }
  finally { window.location.replace(LOGIN_URL); }
});

$('btn-refresh').addEventListener('click', () => loadAll());
</script>
